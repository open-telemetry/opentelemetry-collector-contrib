$defs:
  api_config:
    type: object
    properties:
      key:
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      site:
        type: string
  config:
    description: Config configures an Agent-protocol RC endpoint backed by the Agent RC service.
    type: object
    properties:
      cache_directory:
        type: string
      enabled:
        type: boolean
      refresh_interval:
        type: string
        format: duration
      request_timeout:
        type: string
        format: duration
    allOf:
      - $ref: go.opentelemetry.io/collector/config/confighttp.server_config
  instrumentation_telemetry_config:
    description: InstrumentationTelemetryConfig controls opaque, synchronous SDK forwarding.
    type: object
    properties:
      enabled:
        type: boolean
      endpoint:
        type: string
      max_concurrent_requests:
        type: integer
      max_inflight_bytes:
        type: integer
        x-customType: int64
      max_request_bytes:
        type: integer
        x-customType: int64
      timeout:
        type: string
        format: duration
