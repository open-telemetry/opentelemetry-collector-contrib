$defs:
  settings:
    description: 'Settings defines configuration for converting resource attributes to telemetry attributes or constant labels. When used, it is typically embedded in the exporter configuration under a key name chosen by the exporter (e.g. `resource_constant_labels` for Prometheus exporters, or `resource_to_telemetry_conversion` for AWS EMF exporter): type Config struct { // ... resourcetotelemetry.Settings `mapstructure:"resource_constant_labels"` }'
    type: object
    properties:
      enabled:
        description: 'Enabled indicates whether to convert resource attributes to telemetry attributes. Default is `false`. Deprecated: Use Included and Excluded instead. To convert all resource attributes, set Included to ["*"].'
        type: boolean
      exclude_service_attributes:
        description: 'ExcludeServiceAttributes indicates whether to exclude `service.name`, `service.instance.id` and `service.namespace` resource attributes from being converted to metric attributes. Default is `false`. When set to `true`, these attributes will not be added to metric labels since they are already mapped to Prometheus `job` and `instance` labels respectively. Deprecated: Use Excluded instead. To exclude service attributes, add "service.name", "service.instance.id", and "service.namespace" to Excluded.'
        type: boolean
      excluded:
        description: Excluded represents a list of patterns (supporting wildcards '*' and '?') of resource attribute keys to exclude, overriding anything that matched Included. If Included is empty, setting Excluded implies including all non-excluded attributes.
        type: array
        items:
          type: string
      included:
        description: 'Included represents a list of patterns (supporting wildcards ''*'' and ''?'') of resource attribute keys to include. Wildcards ''*'' and ''?'' match any sequence of characters and any single character respectively (and cannot be escaped). Note: if Included is empty and Excluded is non-empty, all resource attributes except those matched by Excluded will be included.'
        type: array
        items:
          type: string
