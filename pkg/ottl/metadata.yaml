type: ottl

status:
  class: pkg
  stability:
    development: [ profiles ]
    beta: [ traces, metrics, logs ]
  codeowners:
    active: [TylerHelmuth, evan-bradley, edmocosta, bogdandrutu]
    emeritus: [anuraaga, kentquirk]
    seeking_new: true

feature_gates:
  - id: "ottl.PanicDuplicateName"
    description: When enabled, the CreateFactoryMap panics if the name is duplicated.
    stage: stable
    from_version: v0.141.0
    to_version: v0.161.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/44630

  - id: "ottl.contexts.enableOTelColContext"
    description: Enable the `otelcol` context for OTTL. This allows users using `otelcol.*` paths in their OTTL statements and conditions.
    stage: stable
    from_version: v0.147.0
    to_version: v0.161.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/46437

  - id: "ottl.functions.enableLambda"
    description: Allow OTTL functions to take lambda arguments. When disabled, lambda arguments are rejected.
    stage: alpha
    from_version: v0.155.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/48227

  - id: "ottl.functions.enableExperimental"
    description: When enabled, experimental functions are added to the standard OTTL function maps. When disabled, experimental functions are not registered and cannot be used. This gate is a permanent opt-in for experimental functions and is never expected to move to beta or stable; individual functions instead graduate by being promoted out of the experimental set.
    stage: alpha
    from_version: v0.161.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/50927

  - id: "ottl.set.allowNil"
    description: When enabled, the set function passes nil values directly to the target.
    stage: beta
    from_version: v0.158.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/49741
