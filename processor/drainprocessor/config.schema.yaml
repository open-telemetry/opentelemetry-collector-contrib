$defs:
  masking_rule:
    description: MaskingRule declares a regex whose matches in the log body are substituted with the literal token "<name>" before the body is fed to the Drain tree.
    type: object
    properties:
      name:
        description: Name is the mask token used in place of matches. It appears verbatim inside angle brackets in derived templates (e.g. "<ip>") and as the suffix of the corresponding extracted-parameter attribute key ("<ParameterKeyPrefix>.<Name>"). Must be non-empty, must not contain "<", ">", or whitespace, and must not equal "*" (reserved for Drain's own wildcard).
        type: string
      pattern:
        description: Pattern is a Go regular expression (RE2 syntax). Each match in the working copy of the body is replaced with "<Name>". Capture groups are permitted but ignored — the whole match is replaced.
        type: string
description: Config defines configuration for the drain processor.
type: object
properties:
  body_field:
    description: BodyField optionally specifies a top-level key to extract from a structured (map) log body before feeding the value to Drain. If empty, the full body string representation is used. This is a convenience for pipelines where the body is a parsed map (e.g. after json_parser) and the user does not have a move operator to promote the message field back to a plain string body. Pipelines that do have that control should use a move operator instead and leave this unset.
    type: string
  emit_wildcards:
    description: 'EmitWildcards, when true, writes a positional string slice attribute containing the body tokens at each Drain <*> position in template order. Independent of MaskingRules: enable this to see raw variable values without configuring any masks, or in combination with MaskingRules to capture positions no rule named. Default: false.'
    type: boolean
  extra_delimiters:
    description: ExtraDelimiters are additional token delimiters beyond whitespace.
    type: array
    items:
      type: string
  masking_rules:
    description: MaskingRules are regex substitutions applied to a working copy of the body before it is fed to the Drain tree. Rules apply in declaration order; each rule runs on the output of the previous rule. Matched substrings become literal mask tokens in derived templates (e.g. "<ip>"), improving tree stability on high-cardinality values. When non-empty, each masked position is written to a dynamic attribute keyed as "<ParameterKeyPrefix>.<name>".
    type: array
    items:
      $ref: masking_rule
  max_clusters:
    description: 'MaxClusters is the maximum number of clusters tracked. When the limit is reached, the least recently used cluster is evicted. 0 means unlimited. Default: 0.'
    type: integer
  max_node_children:
    description: 'MaxNodeChildren is the maximum number of children per internal parse tree node (called `maxChild` in the Drain paper). Bounds memory on high-cardinality token positions. Default: 100.'
    type: integer
  merge_threshold:
    description: 'MergeThreshold is the minimum token-match ratio (0.0–1.0) required to merge a log line into an existing cluster rather than creating a new one (called `st` in the Drain paper). Default: 0.4.'
    type: number
    x-customType: float64
  parameter_key_prefix:
    description: 'ParameterKeyPrefix is the attribute-key prefix for extracted named parameters. Each masked position writes an attribute at "<ParameterKeyPrefix>.<mask name>" with the raw body value. Matches the OpenTelemetry semantic-convention pattern used by http.request.header.<key> and db.query.parameter.<key>. Only consulted when MaskingRules is non-empty. Default: "log.record.template.parameter".'
    type: string
  save_interval:
    description: SaveInterval is the interval between periodic snapshot saves to storage. 0 (default) disables periodic saves — the tree is only saved on shutdown. Requires storage to be set.
    type: string
    format: duration
  seed_logs:
    description: SeedLogs is a list of raw example log lines to train on at startup. Drain derives templates from these lines itself. Masking rules apply to seed logs the same way they apply to live records.
    type: array
    items:
      type: string
  seed_templates:
    description: SeedTemplates is a list of pre-known template strings to train on at startup before any live logs arrive. Improves template stability across restarts for known log patterns.
    type: array
    items:
      type: string
  storage:
    description: Storage is the ID of a storage extension to use for persisting the Drain tree across restarts. When set, the tree is loaded on startup and saved on shutdown (and optionally at a periodic interval; see SaveInterval). When a snapshot is loaded successfully, seed_templates and seed_logs are skipped. With a shared storage backend (Redis, database), periodic saves let new instances in a scaled deployment inherit a trained tree from existing instances. Optional — when unset the processor is stateless.
    x-pointer: true
    type: string
    x-customType: go.opentelemetry.io/collector/component.ID
  template_attribute:
    description: 'TemplateAttribute is the log record attribute key to write the derived template string to. Default: "log.record.template".'
    type: string
  tree_depth:
    description: 'TreeDepth is the max depth of the Drain parse tree (called `depth` in the Drain paper). Higher values produce more specific templates. Default: 4. Minimum: 3.'
    type: integer
  warmup_min_clusters:
    description: WarmupMinClusters is the number of distinct clusters that must be observed before annotation is enabled. During warmup, records pass through immediately but the template attribute is not written — the tree trains on them without emitting unstabilised templates. 0 (default) disables warmup suppression and annotates from the first record.
    type: integer
  wildcards_attribute:
    description: 'WildcardsAttribute is the log record attribute key for the wildcards slice. Only consulted when EmitWildcards is true. Default: "log.record.template.wildcards".'
    type: string
