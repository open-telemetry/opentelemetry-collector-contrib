type: resourcedetectionprocessor/consul

parent: resourcedetection

feature_gates:
  - id: processor.resourcedetection.consul.prefixMetaAttributes
    stage: alpha
    description: When enabled, Consul node metadata is emitted as `consul.meta.<key>` resource attributes instead of `<key>`.
    from_version: v0.158.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/49988

resource_attributes:
  cloud.region:
    description: The cloud.region
    type: string
    enabled: true
  host.id:
    description: The host.id
    type: string
    enabled: true
  host.name:
    description: The hostname
    type: string
    enabled: true
