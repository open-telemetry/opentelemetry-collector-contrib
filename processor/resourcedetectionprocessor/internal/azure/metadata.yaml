type: azuredetector
sem_conv_version: 1.43.0

status:
  class: processor
  stability:
    beta: [traces, metrics, logs]
    development: [profiles]
  codeowners:
    active: [Aneurysm9, dashpole, paulojmdias]

resource_attributes:
  azure.resource_group.name:
    description: The azure.resource_group.name. Only emitted when the processor.azuredetector.RenameResourceGroupAttribute feature gate is enabled.
    enabled: true
    type: string
  azure.resourcegroup.name:
    description: The azure.resourcegroup.name. Deprecated, use azure.resource_group.name instead by enabling the processor.azuredetector.RenameResourceGroupAttribute feature gate.
    enabled: true
    type: string
  azure.vm.name:
    description: The azure.vm.name
    enabled: true
    type: string
  azure.vm.scaleset.name:
    description: The azure.vm.scaleset.name
    enabled: true
    type: string
  azure.vm.size:
    description: The azure.vm.size
    enabled: true
    type: string
  cloud.account.id:
    semantic_convention:
      ref: cloud.md#cloud-account-id
    description: The cloud.account.id
    type: string
    enabled: true
  cloud.availability_zone:
    semantic_convention:
      ref: cloud.md#cloud-availability-zone
    description: The cloud availability zone
    type: string
    enabled: false
  cloud.platform:
    semantic_convention:
      ref: cloud.md#cloud-platform
    description: The cloud.platform
    type: string
    enabled: true
  cloud.provider:
    semantic_convention:
      ref: cloud.md#cloud-provider
    description: The cloud.provider
    type: string
    enabled: true
  cloud.region:
    semantic_convention:
      ref: cloud.md#cloud-region
    description: The cloud.region
    type: string
    enabled: true
  host.id:
    semantic_convention:
      ref: host.md#host-id
    description: The host.id
    type: string
    enabled: true
  host.name:
    semantic_convention:
      ref: host.md#host-name
    description: The hostname
    type: string
    enabled: true

feature_gates:
  - id: processor.azuredetector.RenameResourceGroupAttribute
    stage: alpha
    description: >-
      When enabled, the azure detector emits the azure.resource_group.name resource attribute
      instead of azure.resourcegroup.name, aligning with semantic convention naming.
    from_version: v0.165.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/49079
