type: resourcedetectionprocessor/lambda
sem_conv_version: 1.43.0

parent: resourcedetection

feature_gates:
  - id: processor.resourcedetection.lambda.faasMaxMemoryBytes
    stage: alpha
    description: >-
      When enabled, the lambda detector emits `faas.max_memory` as an int in bytes, as defined by the
      semantic conventions, instead of a string in MiB.
    from_version: v0.167.0
    reference_url: https://github.com/open-telemetry/opentelemetry-go-contrib/issues/8940

