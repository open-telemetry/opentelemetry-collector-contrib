type: resourcedetectionprocessor/openshift
sem_conv_version: 1.43.0

parent: resourcedetection

feature_gates:
  - id: processor.resourcedetection.openshift.removeCloudNameRegion
    stage: alpha
    description: >-
      When enabled, the detector no longer sets `cloud.region` from the Azure or OpenStack `cloudName`,
      which names a cloud environment or a `clouds.yaml` entry rather than a region.
    from_version: v0.163.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/48159

resource_attributes:
  cloud.platform:
    semantic_convention:
      ref: cloud.md#cloud-platform
    description: The cloud.platform
    type: string
    enabled: true
  cloud.provider:
    semantic_convention:
      ref: cloud.md#cloud-provider
    description: The cloud.provider
    type: string
    enabled: true
  cloud.region:
    semantic_convention:
      ref: cloud.md#cloud-region
    description: The cloud.region
    type: string
    enabled: true
  k8s.cluster.name:
    semantic_convention:
      ref: k8s.md#k8s-cluster-name
    description: The k8s.cluster.name
    type: string
    enabled: true
