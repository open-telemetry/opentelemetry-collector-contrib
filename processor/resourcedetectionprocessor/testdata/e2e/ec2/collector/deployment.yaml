apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Name }}
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Name }}
  template:
    metadata:
      labels:
        app: {{ .Name }}
    spec:
      serviceAccountName: {{ .Name }}-sa
      initContainers:
        - name: imds
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command:
            - python3
            - /scripts/server.py
          env:
            - name: PORT
              value: "1338"
          ports:
            - containerPort: 1338
              name: metadata
          startupProbe:
            httpGet:
              path: /healthz
              port: 1338
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 10
          volumeMounts:
            - name: imds-script
              mountPath: /scripts
      containers:
        - name: otelcol
          image: otelcontribcol:latest
          imagePullPolicy: Never
          env:
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
              value: "http://localhost:1338"
            - name: AWS_REGION
              value: "us-east-1"
          args:
            - "--config=/conf/relay"
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: {{ .Name }}-config
            items:
              - key: relay
                path: relay
        - name: imds-script
          configMap:
            name: {{ .Name }}-imds-config
