display_name: Redaction Processor
type: redaction

description: |
  This processor deletes span, log, and metric datapoint attributes that don't match a list of allowed
  attributes. It also masks attribute values that match a blocked value
  list. Attributes that aren't on the allowed list are removed before any
  value checks are done.

status:
  class: processor
  stability:
    beta: [traces]
    alpha: [logs,metrics]
  distributions: [contrib, k8s]
  codeowners:
    active: [mx-psi, TylerHelmuth, iblancasa]
    emeritus: [leonsp-ai, dmitryax]

tests:
  config:
  goleak:
    ignore:
      top:
        - "sync.runtime_notifyListWait"

telemetry:
  metrics:
    processor_redaction_errors_total:
      enabled: true
      description: Total number of errors encountered during redaction or configuration compilation
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      stability: development
    processor_redaction_redacted_attributes_total:
      enabled: true
      description: Total number of attributes redacted (masked or deleted) by the redaction processor
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      stability: development
