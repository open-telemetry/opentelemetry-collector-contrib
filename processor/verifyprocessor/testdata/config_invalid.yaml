# Verify processor — invalid configurations used in negative tests.

# Missing key material (no key_source).
verify/missing_key_source:
  mode: sync

# Invalid key_source.type.
verify/bad_key_source_type:
  key_source:
    type: unknown

# File key_source without cert or HMAC material.
verify/file_missing_material:
  key_source:
    type: file
    file: {}

# Invalid mode.
verify/bad_mode:
  mode: deferred
  key_source:
    type: file
    file:
      hmac_key_file: /etc/otelcol/hmac.key

# Invalid failure_mode.
verify/bad_failure_mode:
  failure_mode: drop
  key_source:
    type: file
    file:
      hmac_key_file: /etc/otelcol/hmac.key

# Hash chain enabled without storage.
verify/hash_chain_missing_storage:
  key_source:
    type: file
    file:
      hmac_key_file: /etc/otelcol/hmac.key
  hash_chain:
    enabled: true

# Dead letter enabled without storage.
verify/dead_letter_missing_storage:
  key_source:
    type: file
    file:
      hmac_key_file: /etc/otelcol/hmac.key
  dead_letter:
    enabled: true

# k8s_secret missing name.
verify/k8s_missing_name:
  key_source:
    type: k8s_secret
    k8s_secret:
      hmac_key: hmac.key

# Invalid dead_letter.failure_modes entry.
verify/bad_dead_letter_mode:
  key_source:
    type: file
    file:
      hmac_key_file: /etc/otelcol/hmac.key
  dead_letter:
    enabled: true
    storage: file_storage
    failure_modes:
      - drop
