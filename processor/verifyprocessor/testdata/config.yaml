# Verify processor — file-based HMAC key (minimal config).
# mode, failure_mode, and verification_profile use their defaults
# (sync, strict, default).
verify:
  key_source:
    type: file
    file:
      hmac_key: /etc/otelcol/hmac.key

# Asymmetric certificate verification with mark failure mode.
verify/cert_mark:
  mode: sync
  failure_mode: mark
  verification_profile: default
  key_source:
    type: file
    file:
      certificate: /etc/otelcol/cert.pem

# Combined HMAC + certificate verification.
verify/hmac_and_cert:
  key_source:
    type: file
    file:
      hmac_key: /etc/otelcol/hmac.key
      certificate: /etc/otelcol/cert.pem

# Environment-variable key material (values are env-var names).
verify/env:
  key_source:
    type: env
    env:
      certificate: VERIFY_CERT_PEM
      hmac_key: VERIFY_HMAC_KEY

# Kubernetes Secret key material (values are keys within the Secret).
verify/k8s:
  key_source:
    type: k8s_secret
    k8s_secret:
      name: verify-secret
      namespace: default
      hmac_key: hmac.key
      certificate: tls.crt

# OpenBao / Vault key material (values are fields within the secret).
verify/bao:
  key_source:
    type: bao
    bao:
      address: https://bao.example.com
      secret_path: secret/data/verify
      certificate: certificate
      hmac_key: hmac_key

# Hash-chain continuity enabled (requires a storage extension).
verify/hash_chain:
  key_source:
    type: file
    file:
      hmac_key: /etc/otelcol/hmac.key
  hash_chain:
    enabled: true
    storage: file_storage

# Dead-letter queue for verification failures.
verify/dead_letter:
  failure_mode: mark
  key_source:
    type: file
    file:
      hmac_key: /etc/otelcol/hmac.key
  dead_letter:
    enabled: true
    storage: file_storage
    key_prefix: audit_verify_dlq/
    reasons:
      - integrity_mismatch
      - missing_integrity_value
    partition_by_stream: true
    fail_on_storage_error: true
