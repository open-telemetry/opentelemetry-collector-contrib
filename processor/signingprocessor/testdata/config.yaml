# Signing processor — file-based key material (minimal config).
# algorithm and certificate_ref use their defaults (RS256, fingerprint).
signing:
  key_source:
    type: file
    file:
      certificate: /etc/otelcol/signing-cert.pem
      private_key: /etc/otelcol/signing-key.pem

# RS512 variant with full certificate reference.
signing/sha512_full:
  algorithm: RS512
  certificate_ref: full
  key_source:
    type: file
    file:
      certificate: /etc/otelcol/signing-cert.pem
      private_key: /etc/otelcol/signing-key.pem

# Environment-variable key material.
signing/env:
  key_source:
    type: env
    env:
      certificate: SIGNING_CERT_PEM
      private_key: SIGNING_KEY_PEM

# Kubernetes Secret key material.
signing/k8s:
  key_source:
    type: k8s_secret
    k8s_secret:
      name:        signing-secret
      namespace:   default
      certificate: tls.crt
      private_key: tls.key

# OpenBao / Vault key material.
signing/bao:
  key_source:
    type: bao
    bao:
      address:     https://bao.example.com
      mount_path:  secret
      secret_path: signing
      certificate: certificate
      private_key: private_key

# HMAC-SHA256 with key from environment variable.
signing/hmac:
  algorithm: HMAC-SHA256
  key_source:
    type: env
    env:
      hmac_key: SIGNING_HMAC_KEY
