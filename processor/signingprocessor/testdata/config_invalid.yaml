# Signing processor — invalid configurations used in negative tests.

# Missing key_source.type (empty type triggers errInvalidKeySourceType).
signing/missing_key_source:
  algorithm: RS256

# Invalid algorithm.
signing/bad_hash:
  algorithm: MD5
  key_source:
    type: file
    file:
      certificate: /etc/otelcol/cert.pem
      private_key: /etc/otelcol/key.pem

# Invalid certificate_ref value.
signing/bad_cert_ref:
  certificate_ref: base64
  key_source:
    type: file
    file:
      certificate: /etc/otelcol/cert.pem
      private_key: /etc/otelcol/key.pem

# file provider — missing certificate.
signing/file_missing_cert:
  key_source:
    type: file
    file:
      private_key: /etc/otelcol/key.pem

# env provider — missing private_key.
signing/env_missing_key:
  key_source:
    type: env
    env:
      certificate: SIGNING_CERT_PEM

# k8s_secret provider — missing secret name.
signing/k8s_missing_name:
  key_source:
    type: k8s_secret
    k8s_secret:
      certificate: tls.crt
      private_key: tls.key

# bao provider — missing secret_path.
signing/bao_missing_path:
  key_source:
    type: bao
    bao:
      certificate: certificate
      private_key: private_key
