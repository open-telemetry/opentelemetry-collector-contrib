description: 'Config defines the user-facing configuration for the rolling_span_latency processor. Every field maps directly to a key in the OpenTelemetry Collector YAML configuration file under the processor''s stanza, for example: processors: rolling_span_latency: half_life: 2h slow_threshold: 3.0 very_slow_threshold: 4.0'
type: object
properties:
  always_include_root_spans:
    description: AlwaysIncludeRootSpans, when true, evaluates root spans — spans with no parent span ID — regardless of their kind, in addition to any spans matched by SpanKinds. It never excludes a span that would already be evaluated; a false value simply means root spans get no special treatment and are evaluated only via SpanKinds (or via the unfiltered default when SpanKinds is also empty). If set to true while SpanKinds is empty, only root spans are evaluated — SpanKinds contributes no matches of its own in that case.
    type: boolean
  attribute_key:
    description: AttributeKey is the name of the span attribute the processor writes with a value of "slow" or "very_slow" once a baseline has warmed up. Must be non-empty.
    type: string
  churn_warning_ratio:
    description: ChurnWarningRatio is the fraction of tracked baseline keys, evicted in a single eviction sweep, above which the processor logs a warning that ResourceKeyAttributes may be producing high-cardinality keys. Must be greater than 0 and less than or equal to 1.
    type: number
    x-customType: float64
  eviction_interval:
    description: EvictionInterval controls how often the processor scans for and removes baseline keys that have been idle longer than IdleTimeout. Must be greater than 0.
    type: string
    format: duration
  half_life:
    description: 'HalfLife controls how quickly the rolling mean/variance baseline forgets older observations: after HalfLife has elapsed, an observation''s weight in the EWMA is halved. Must be greater than 0.'
    type: string
    format: duration
  idle_timeout:
    description: IdleTimeout is how long a baseline key can go without a new observation before it becomes eligible for eviction. Must be greater than 0.
    type: string
    format: duration
  max_baselines:
    description: MaxBaselines caps the number of concurrently tracked baseline keys. New keys observed once the cap is reached are dropped and left unlabeled until existing keys are evicted. Set to 0 to disable the cap. Must be greater than or equal to 0.
    type: integer
  min_stddev:
    description: MinStddev is the floor applied to a baseline's rolling standard deviation before computing how many deviations a span's duration is from the mean. This avoids flagging spans as slow purely from natural noise in an otherwise very stable, low-variance baseline. Must be greater than or equal to 0.
    type: string
    format: duration
  resource_key_attributes:
    description: ResourceKeyAttributes lists the resource attributes, in order, that are combined with the span name to form the key each rolling latency baseline is tracked under. Must be non-empty.
    type: array
    items:
      type: string
  slow_threshold:
    description: SlowThreshold is the number of standard deviations above the rolling mean a span's duration must exceed to be labeled "slow". Must be greater than 0.
    type: number
    x-customType: float64
  span_kinds:
    description: 'SpanKinds, if non-empty, restricts which spans the processor tracks and labels to those whose kind matches one of the listed values. Accepted values (case-insensitive): INTERNAL, SERVER, CLIENT, PRODUCER, CONSUMER. A span is evaluated if its kind is listed here, or if AlwaysIncludeRootSpans is true and the span is a root span (see AlwaysIncludeRootSpans). If SpanKinds is empty and AlwaysIncludeRootSpans is false, every span is evaluated — the processor''s default, pre-filtering behavior.'
    type: array
    items:
      type: string
  very_slow_threshold:
    description: VerySlowThreshold is the number of standard deviations above the rolling mean a span's duration must exceed to be labeled "very_slow" instead of "slow". Must be greater than SlowThreshold.
    type: number
    x-customType: float64
  warmup_count:
    description: WarmupCount is the number of observations a baseline key must accumulate before the processor starts labeling spans for that key. This avoids labeling spans against a statistically unreliable, freshly created baseline. Must be greater than 0.
    type: integer
