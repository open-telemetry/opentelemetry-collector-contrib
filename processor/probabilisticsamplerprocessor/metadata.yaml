display_name: Probabilistic Sampling Processor
type: probabilistic_sampler

status:
  class: processor
  stability:
    beta: [traces]
    alpha: [logs]
  distributions: [core, contrib, k8s]
  codeowners:
    active: [jmacd]
    emeritus: [jpkrohling]
    seeking_new: true

tests:
  skip_context_propagation: true
  config:

telemetry:
  metrics:
    processor_probabilistic_sampler_count_logs_sampled:
      enabled: true
      description: Count of logs that were sampled or not
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    processor_probabilistic_sampler_count_spans_processed_total:
      enabled: true
      description: Count of spans that were sampled or not
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    processor_probabilistic_sampler_count_traces_sampled:
      enabled: true
      description: "[DEPRECATED] Count of spans that were sampled or not"
      deprecated:
        since: 0.161.0
        note: "Use processor_probabilistic_sampler_count_spans_processed_total instead"
      stability: deprecated
      unit: "1"
      sum:
        value_type: int
        monotonic: true
