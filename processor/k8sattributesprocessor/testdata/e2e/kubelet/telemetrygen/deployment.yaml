apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Name }}-{{ .DataType }}-deployment
  namespace: e2ek8sattribute-kubelet
  labels:
    app: {{ .Name }}-{{ .DataType }}-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Name }}-{{ .DataType }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Name }}-{{ .DataType }}-deployment
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
          command:
            - /telemetrygen
            - {{ .DataType }}
            - --otlp-insecure
            - --otlp-endpoint={{ .OTLPEndpoint }}
            - --duration=36000s
            - --rate=1
            - --batch=false
            - --otlp-attributes=service.name="test-{{ .DataType }}-deployment"
            - --allow-export-failures
{{- if eq .DataType "traces" }}
            - --status-code=
{{- end }}
          imagePullPolicy: IfNotPresent
