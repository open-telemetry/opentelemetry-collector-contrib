$defs:
  flatten_config:
    description: FlattenConfig configures, per signal, whether the data is flattened for all statement groups of that signal.
    type: object
    properties:
      logs:
        description: Logs gives each log record a distinct copy of its resource and scope for all log_statements groups. Requires the transform.flatten.logs feature gate.
        type: boolean
description: Config defines the configuration for the processor.
type: object
properties:
  error_mode:
    description: ErrorMode determines how the processor reacts to errors that occur while processing a statement. Valid values are `ignore` and `propagate`. `ignore` means the processor ignores errors returned by statements and continues on to the next statement. This is the recommended mode. `propagate` means the processor returns the error up the pipeline.  This will result in the payload being dropped from the collector. The default value is `ignore`.
    $ref: /pkg/ottl.error_mode
  flatten:
    $ref: flatten_config
  log_statements:
    type: array
    items:
      $ref: ./internal/common.context_statements
  metric_statements:
    type: array
    items:
      $ref: ./internal/common.context_statements
  profile_statements:
    description: 'ProfileStatements configures the OTTL statements executed against profile data. Experimental: *NOTE* this API is subject to change or removal in the future.'
    type: array
    items:
      $ref: ./internal/common.context_statements
  trace_statements:
    type: array
    items:
      $ref: ./internal/common.context_statements
