$defs:
  context_id:
    description: ContextID is the name of the OTTL context a group of statements runs against.
    type: string
  context_statements:
    description: ContextStatements is a group of OTTL statements and conditions executed together.
    type: object
    properties:
      conditions:
        type: array
        items:
          type: string
      context:
        $ref: context_id
      error_mode:
        description: ErrorMode determines how the processor reacts to errors that occur while processing this group of statements. When provided, it overrides the default Config ErrorMode.
        $ref: /pkg/ottl.error_mode
      shared_cache:
        description: SharedCache enables sharing per-context caches between all statement groups with this option enabled in the same processor instance.
        type: boolean
      statements:
        type: array
        items:
          type: string
