$defs:
  enforcement_mode:
    description: EnforcementMode determines how the processor handles attributes that exceed the cardinality delta threshold.
    type: string
description: 'Config defines the user-facing configuration for the cardinality_guardian processor. Every field maps directly to a key in the OpenTelemetry Collector YAML configuration file under the processor''s stanza, for example: processors: cardinality_guardian: max_cardinality_delta_per_epoch: 500 epoch_duration_seconds: 300 never_drop_labels: [region, http.status_code] enforcement_mode: tag_only estimated_cost_per_metric_month: 0.05'
type: object
properties:
  drop_log_max_per_epoch:
    description: DropLogMaxPerEpoch caps the number of "Dropping high-cardinality attribute" Warn logs emitted per epoch. After this many warnings, further drops are silently counted and a single summary line is emitted at the next epoch rotation. Set to 0 to disable the cap (log every drop — not recommended at scale). Must be ≥ 0.
    type: integer
  enforcement_mode:
    description: 'EnforcementMode controls how the processor handles high-cardinality attributes once the delta threshold is exceeded. Three modes are available: - "tag_only" — preserves all attributes and injects "otel.metric.overflow: true" for downstream routing. No data mutation. This is the safest mode and recommended for initial deployment. - "overflow_attribute" — replaces the high-cardinality attribute value with a sentinel "otel.cardinality_overflow" string. All overflowed data points merge into a single overflow bucket. This is OTel-SDK- spec-aligned and avoids the Single-Writer violation because all overflow points share one identity. - "strip_and_reaggregate" — removes the offending attribute and performs inline spatial reaggregation to merge data points that now share the same identity. Currently supports Delta Sum and Gauge metric types. Cumulative Sums, Histograms, and ExponentialHistograms fall back to tag_only behavior with a warning log. If empty, defaults to "tag_only".'
    $ref: enforcement_mode
  epoch_duration_seconds:
    description: EpochDurationSeconds controls how often the sliding cardinality window advances. At the end of each epoch the processor takes the completed epoch's values as the new baseline and starts a fresh sketch for the new epoch. The delta check then measures growth relative to the last epoch, not the lifetime of the processor. Shorter epochs are more sensitive to sudden cardinality explosions but may produce noisier decisions for metrics with naturally bursty label spaces. Longer epochs smooth out transient bursts at the cost of slower reaction time. Must be at least 10 seconds to avoid runaway ticker behavior.
    type: integer
  estimated_cost_per_metric_month:
    description: EstimatedCostPerMetricMonth configures the theoretical cost per active time-series. This is used solely to populate the "otelcol_processor_cardinality_estimated_savings_dollars_total" OTel counter emitted by this processor. It allows platform owners to quantify FinOps ROI directly in the processor's cardinality-enforcement logic. A reasonable starting point is $0.05/metric/month, which corresponds roughly to the per-series pricing of managed Prometheus offerings. Set to 0.0 to disable cost tracking without affecting enforcement. Must be ≥ 0.
    type: number
    x-customType: float64
  max_cardinality_delta_per_epoch:
    description: MaxCardinalityDeltaPerEpoch is the maximum number of new unique label values that are allowed for a single metric+label-key combination within one epoch. Once this threshold is exceeded, additional unique values are handled according to the configured EnforcementMode. The processor measures cardinality growth using HyperLogLog sketches and counts the values seen this epoch that were absent from the previous epoch. Only that *delta* (new unique values) is checked, not the absolute cardinality. This prevents the processor from penalizing stable high-cardinality metrics that have already reached a steady state. Must be greater than 0.
    type: integer
  max_tracker_count:
    description: MaxTrackerCount is the absolute maximum number of concurrent (metric, label) tracking sketches across all shards. If this limit is reached, new (metric, label) pairs are silently ignored and passed through until existing trackers are evicted. Set to 0 to disable the limit entirely (allow unlimited growth). Must be ≥ 0 and ≤ 10,000,000.
    type: integer
  metric_overrides:
    description: MetricOverrides allows per-metric cardinality limits that override the global MaxCardinalityDeltaPerEpoch. This is useful when specific metrics (e.g. http.server.request.duration) legitimately need higher headroom than the global default, while keeping the global safety net tight. Unspecified metrics fall back to MaxCardinalityDeltaPerEpoch. Each override value must be > 0.
    type: object
    additionalProperties:
      type: integer
  never_drop_labels:
    description: NeverDropLabels is the list of label keys that the processor will never strip or tag, regardless of how high their cardinality grows. Use this for labels whose values are essential for query correctness, such as "region", "http.status_code", or "service.name". The lookup is O(1) via a pre-built map; the slice is only read at construction time and never accessed in the hot path.
    type: array
    items:
      type: string
  top_offenders_count:
    description: TopOffendersCount is the number of highest-delta (metric, label) pairs to report via the "otelcol_processor_cardinality_top_offenders" gauge. The snapshot is computed once per epoch rotation, so it adds no hot-path cost. Set to 0 to disable the Top-N gauge entirely. Must be ≥ 0.
    type: integer
