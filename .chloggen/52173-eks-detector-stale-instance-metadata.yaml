# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: processor/resource_detection

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Stop the EKS detector reporting a previous run's EC2 instance metadata

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [52173]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `cloud.account.id`, `host.image.id`, `host.type`, and `host.name` were only assigned
  when the `ec2:DescribeInstances` response described an instance, and the detector
  keeps its provider between runs. A later response that succeeded while describing no
  instance therefore left the previous run's values in place and reported them as if
  that response had carried them.

  These four attributes are now cleared before each response is read, and each one is
  reported only when the response carried a value for it, so a run that establishes
  nothing reports nothing rather than an empty string. The stale values only affected
  the `refresh_interval` and retry paths, since a single detection run has no previous
  response to inherit from.

