# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: exporter/azuredataexplorer

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Compress the payload with gzip before handing it to the Kusto client, which the ingest options already declare it to be. Previously the plain JSON was labelled as gzip, so every streaming request in `managed` ingestion mode was rejected with a 400 and the client silently fell back to queued ingestion, which uploaded the payload uncompressed.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [52906]

# (Optional) One or more lines of additional information to render under the primary note.
subtext:

# Optional: The change log or logs in which this entry should be included.
change_logs: [user]
