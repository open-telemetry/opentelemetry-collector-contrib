# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/oracledb

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Collect `db.server.top_query` on its configured `collection_interval` instead of 10 seconds early, and stop reporting an idle instance as a scrape error.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50796]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The 10-second `V$SQL` refresh buffer was added to the elapsed time before it was compared against
  the configured interval, so a `collection_interval` of 60s collected roughly every 50s. The buffer
  now only widens the query window, which is what it was meant to do, and no longer advances the
  schedule. Separately, a scrape that returned no rows raised `no data returned from
  oracleQueryMetricsClient`, logging an error with a stack trace on every interval of an idle
  instance; an empty result set is now treated as the normal condition it is.

