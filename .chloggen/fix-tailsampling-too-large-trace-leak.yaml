# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: processor/tail_sampling

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Fix a memory leak when `maximum_trace_size_bytes` is enabled and no non-sampled decision cache is configured.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50976]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  A trace that grows over several batches already has its earlier batches in tail
  storage by the time it exceeds `maximum_trace_size_bytes`. The drop path removed
  the trace from the decision batcher, so no tick would ever take those spans from
  storage, and relied on `releaseNotSampledTrace` for eviction, which only evicts
  on a non-sampled decision cache hit. With the default `NopCache` the `idToTrace`
  entry, its delete queue element and the accumulated spans in tail storage were
  all retained until the trace was eventually evicted by `num_traces` overflow.
  The trace is now dropped unconditionally on this path.

# If your change doesn't affect end users or the exported elements of any package,
