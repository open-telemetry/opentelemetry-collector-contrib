# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/splunk_hec

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Respond with 503 "Server is busy" (Splunk code 9) when the pipeline is transiently unable to accept data

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [51391]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Previously every consumer (pipeline) error returned 500 Internal Server Error,
  so a Splunk client could not tell a transient backpressure condition from a
  permanent failure. Non-permanent consumer errors now return 503 with Splunk
  code 9 ("Server is busy") so the client retries with backoff, while permanent
  errors continue to return 500. The receiver does not have visibility into
  Splunk indexer queue or ack-service state, so it does not emit the queue- and
  ack-specific health/capacity codes (18-20, 24-27); those are the sending
  client's to interpret.

