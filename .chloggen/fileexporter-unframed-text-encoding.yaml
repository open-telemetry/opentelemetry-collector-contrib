# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: exporter/file

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Frame encoded records by `format` when native compression is enabled, so a compressed file is delimited the same way an uncompressed one is.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [49328]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Setting `encoding` used to force length-prefix framing under the `exporter.file.nativeCompression`
  feature gate, even though the same configuration without compression writes records newline-delimited.
  A text encoding such as `text_encoding` therefore produced a `.zst` file with 4-byte binary headers
  that `zstdcat` and `grep` could not read. Framing now follows `format` whether or not compression is
  enabled: `json` (the default) writes one record per line and `proto` length-prefixes each record.

  This changes behaviour for one configuration: an `encoding` combined with `compression` under the
  feature gate previously received length prefixes and now does not. Set `format: proto` to keep them
  for an encoding that emits binary. Note that the same encoding without `compression` is already
  written without length prefixes today, so this makes the compressed and uncompressed output agree.

