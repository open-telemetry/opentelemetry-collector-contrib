change_type: enhancement
component: receiver/google_cloud_spanner
note: Add top minute split stats metrics and a generic `hide_pii_values` config to the Google Cloud Spanner receiver
issues: [51026]
subtext: |
  Brings parity with the GCP Query Insights Hotspot view by introducing the entirely new `database/spanner/split_stats/top/*` metrics family, mapped from the `SPANNER_SYS.SPLIT_STATS_TOP_MINUTE` table.
  Also introduces a generic `hide_pii_values` configuration option (disabled by default) that securely masks sensitive PII data across supported metrics by hashing them with SHA-256. This is currently enabled for row keys in both lock stats and split stats (`row_range_start_key`, `split_start`, `split_limit`), and is designed to automatically extend to other PII labels in the future.
