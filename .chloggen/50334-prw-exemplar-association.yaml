change_type: bug_fix

component: receiver/prometheus_remote_write

note: Attach exemplars to the series that sent them, once, and to the data point the conversion appended.

issues: [50334]

subtext: |
  Exemplars were keyed by a few fields, and the attribute hash among them came
  from labels that already had job, instance, the metric name and every
  otel_scope_ label taken out. Two targets sending one metric name therefore
  shared a key: a histogram carrying an ordinary label found no exemplars at
  all, and on the counter path one received exemplar could be written to both
  targets. The key is the whole label set now, which is how Prometheus
  identifies a series, so nothing that tells two series apart can be left out.
  The histogram lookup also copied into the first data point of the metric,
  which belongs to whichever series was translated first. Exemplars go to the
  data point the current conversion appended, once, and a histogram the
  converter drops no longer reaches a data point built for an earlier series.

