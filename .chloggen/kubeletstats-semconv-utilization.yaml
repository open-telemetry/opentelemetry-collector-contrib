# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/kubelet_stats

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add semantic conventions compliant `k8s.{pod,container}.{cpu,memory}.{limit,request}.utilization` metrics behind the `receiver.kubelet_stats.EmitV1K8sConventions` and `receiver.kubelet_stats.DontEmitV0K8sConventions` feature gates.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [40444]

# (Optional) One or more lines of additional information to render under the main note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The new memory utilization metrics use the memory working set as the numerator, as defined by the semantic conventions,
  instead of the memory usage used by the legacy `k8s.{pod,container}.memory_{limit,request}_utilization` metrics.
  The CPU utilization metrics are renamed without changing how they are calculated.
  `receiver.kubelet_stats.EmitV1K8sConventions` enables the new metrics and `receiver.kubelet_stats.DontEmitV0K8sConventions`
  disables the legacy ones. Both gates are alpha and disabled by default, so existing output does not change.
  The new metrics are configured with the `@v1` suffix, e.g. `k8s.pod.memory.limit.utilization@v1`.

# If your change doesn't affect end users or the exported elements of any package,
# you should mark it using the change_logs key with the value 'api'.
# Optional: The change logs where the change should be visible. Default is 'user'.
change_logs: [user]
