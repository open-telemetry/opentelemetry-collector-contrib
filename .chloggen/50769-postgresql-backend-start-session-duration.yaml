# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/postgresql

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add `postgresql.backend_start` and `postgresql.session_duration` attributes to `db.server.query_sample`

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50769]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `postgresql.query_start` is the only timestamp query samples previously carried, and it
  changes on every query the backend runs, so it cannot represent how long the underlying
  connection has been open. `postgresql.backend_start` is sourced from
  `pg_stat_activity.backend_start`, which is set once when the backend is created and never
  changes for the life of the connection. `postgresql.session_duration` is the derived whole
  seconds since `backend_start`. Both are purely additive and follow the existing
  `postgresql.blocking.start_time` / `postgresql.blocking.wait_duration` pattern already used
  elsewhere in the same event.

