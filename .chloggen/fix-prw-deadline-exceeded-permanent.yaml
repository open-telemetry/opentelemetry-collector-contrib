change_type: bug_fix

component: exporter/prometheusremotewrite

note: "Fix context.DeadlineExceeded being incorrectly treated as a permanent error, which caused metrics to be dropped instead of retried on timeout."

issues:
  - 49691

subtext: |
  context.DeadlineExceeded indicates a transient timeout and should result in a retry.
  Only context.Canceled (explicit user/component shutdown) should be treated as permanent.

