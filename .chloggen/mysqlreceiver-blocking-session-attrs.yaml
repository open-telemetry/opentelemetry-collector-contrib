# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/mysql

# A brief description of the change. Surround your text with quotes (") if it needs to start with a backtick (`).
note: Adds blocking session attributes to `db.server.query_sample` events for MySQL and MariaDB blocking session detection, including InnoDB row-level locks and metadata locks (MDL).

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [49458]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  New attributes under mysql.blocking.*: mysql.blocking.pids, mysql.blocking.start_time,
  mysql.blocking.wait_duration, mysql.blocking.lock.mode, mysql.blocking.lock.type,
  mysql.blocking.lock.table, mysql.blocking.lock.index, mysql.blocking.transaction.start_time,
  mysql.blocking.lock_level, mysql.blocking.mdl.object_type, mysql.blocking.mdl.object_schema,
  mysql.blocking.mdl.object_name, mysql.blocking.mdl.lock_type.
  mysql.blocking.lock_level distinguishes "row" (InnoDB) from "metadata" (MDL) blocking.
  MySQL 8.0.1+ uses performance_schema.data_lock_waits and performance_schema.metadata_locks.
  MySQL <8.0 and MariaDB use information_schema.innodb_lock_waits and innodb_locks (MDL attributes empty).
  For MDL blocks, blocking_start_time and blocking_wait_duration are derived from
  performance_schema.events_waits_current.TIMER_WAIT.
  Idle-in-transaction blocker sessions (holding locks without an active query) are captured
  via widened WHERE clause on innodb_trx and MDL granted-lock holders.
  All blocking attributes are always present on every db.server.query_sample event;
  empty string / 0 values indicate no active blocking.
  Requires PROCESS privilege for visibility into other sessions' transactions.

