# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/aws_cloudwatch

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Support a list of discovery filters with per-entry `metric_names` and `stats`; deprecate the single-object `filters` form and top-level `discovery.stats`

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [49842]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `metrics.discovery.filters` is now a list of entries, each selecting a namespace, optionally a set
  of `metric_names` within it, and optionally the `stats` to fetch for those metrics. This allows
  discovering a subset of metrics per namespace, using different statistics per metric, and covering
  multiple namespaces with a single receiver instance. `limit` remains a global cap across all
  entries, and when entries overlap the first entry that discovers a metric wins.

  The deprecated single-object form (`filters: {namespace: X, metric_name: Y}`) keeps working and is
  treated as a one-entry list. The deprecated top-level `discovery.stats` also keeps working and
  applies to any filter entry that does not set its own `stats`. Both log a deprecation warning at
  startup.

