change_type: breaking

component: exporter/elasticsearch

note: Default to at-least-once retries on transport errors, client timeouts, and HTTP 429, 500, 502, 503, and 504

issues: [52551]

subtext: |
  Client timeouts are always retried, including when the deadline is exceeded after the request body has started to be sent.
  To keep the previous HTTP status behavior, set `retry::retry_on_status` to `[429]`.

