change_type: bug_fix

component: receiver/sqlserver

note: Fix missing metrics when using direct SQL Server connection - `sqlserver.lock.wait_time.avg`, `sqlserver.transaction.rate`, `sqlserver.page.operation.rate`, `sqlserver.page.lazy_write.rate`, and `sqlserver.transaction_log.growth.count` now emit values on non-Windows platforms and when the receiver is configured with a direct database connection.

issues: [51384]

subtext: |
  `sqlserver.lock.wait_time.avg` is derived from the `Average Wait Time (ms)` counter and its base counter as
  the wait time accrued since the last scrape divided by the number of waits in that window, matching what
  the Windows PDH path reports. No data point is emitted on the first scrape, because an average needs two
  samples, nor for a window in which no lock waits occurred.

