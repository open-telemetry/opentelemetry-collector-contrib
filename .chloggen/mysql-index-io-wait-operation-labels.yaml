change_type: bug_fix

component: receiver/mysql

note: Report `mysql.index.io.wait.count` and `mysql.index.io.wait.time` under the correct `operation` attribute

issues: [49597]

subtext: |
  The index io_waits query listed its COUNT_ and SUM_TIMER_ columns in a different order than the
  fields they were scanned into, so each datapoint was recorded under the wrong operation (for
  example the delete counts were reported as fetch). The columns are now ordered to match the scan,
  consistent with the table io_waits query.
