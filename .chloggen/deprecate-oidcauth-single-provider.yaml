component: extension/oidc
note: "Log a deprecation warning at startup when legacy single-provider configuration fields are used."
issues: [40854]
subtext: |
  The single-provider configuration options (`issuer_url`, `audience`, `ignore_audience`,
  `issuer_ca_path`, `username_claim`, `groups_claim`) are deprecated. A deprecation warning is now logged
  at startup when these fields are used.
