change_type: enhancement

component: exporter/elasticsearch

note: Retry Elasticsearch exports that fail with context.DeadlineExceeded before the connection is ready, including during DNS, the TCP handshake, and the TLS handshake. No request bytes have been written, so a retry cannot duplicate a document.

issues: [52102]

subtext: |
  A context deadline after the connection is ready, including while the request is being written or while waiting for the response, is still not retried.
  Other errors are retried as before.

