# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/googlecloudpubsub

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add `on_decode_error` and `on_pipeline_error` policies with nack support, and a `flow_control.trigger_ack_batch_size` option

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50637]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `on_decode_error` sets what happens to a message the configured encoding fails to decode: `ignore`
  (the new default: acknowledge, drop and count the message; replaces the now deprecated
  `ignore_encoding_error`), `propagate` (the previous default: the message expires its ack deadline and
  is redelivered forever), or `nack` (negatively acknowledge, so the subscription retry policy or
  dead-letter policy applies). The default changing from `propagate` to `ignore` is a behavior change:
  undecodable messages are now dropped and counted instead of redelivering indefinitely. The policy also
  covers messages that cannot be delivered at all - an unknown encoding, or a signal with no consumer
  attached - which previously redelivered forever or were acknowledged and dropped unaccounted. `on_pipeline_error` does the
  same for messages the downstream pipeline rejects: `ack` (default, the previous behavior) or `nack`.
  `flow_control.trigger_ack_batch_size` flushes pending acknowledgements once their count reaches the
  configured size, instead of only on the `trigger_ack_batch_duration` timer.

