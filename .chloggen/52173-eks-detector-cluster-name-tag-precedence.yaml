# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: processor/resource_detection

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Stop letting EC2 tag order decide which cluster the EKS detector reports

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [52173]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  A node can carry more than one EC2 tag that names a cluster. The detector used the
  first one it saw while walking the `ec2:DescribeInstances` response, so the reported
  `k8s.cluster.name` depended on the order EC2 returned the tags in. A
  `kubernetes.io/cluster/<name>` tag, which any user can add, could win over the
  `aws:eks:cluster-name` tag that EKS sets in the reserved `aws:` namespace.

  The tags are now read in a fixed order: `aws:eks:cluster-name`, then
  `eks:cluster-name`, then `kubernetes.io/cluster/<name>` preferring `owned` over
  `shared`. Tags of the same strength naming different clusters do not say which
  cluster the node is in, so no cluster name is reported rather than one of them being
  chosen.

  `k8s.cluster.name` is now also left off when no cluster name was established, where
  it was previously reported as an empty string.

  Enabling the new `aws.eks.cluster.arn` attribute adds a confirmation step that can
  also leave `k8s.cluster.name` off, in the two cases where it establishes that the
  name on the node's tags does not describe this node's cluster: the cluster's OIDC
  issuer not matching the one the node's own Kubernetes API server publishes, and a
  name EKS could not have issued. That attribute is disabled by default.

