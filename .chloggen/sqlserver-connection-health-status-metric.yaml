# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/sqlserver

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add the `sqlserver.health` metric reporting connection health via a `check` attribute (`reachable`, `queryable`).

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50077]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The metric is enabled by default and emitted on every collection interval when the receiver is
  configured to connect directly to SQL Server. `reachable` is a transport-level (pre-auth) TCP check
  of the resolved host:port; `queryable` opens and closes a fresh connection each scrape to
  authenticate and execute a trivial query, so it tests whether a new session can be established
  rather than reusing a pooled one. A failed probe is reported as a `0` datapoint rather than an
  absence of data or a scrape error.
  Because `queryable` establishes a new authenticated session each collection interval, enabling this
  metric adds one login/connection per interval to the server's connection and login rate.
  The top query event now reports the `server.address` and `server.port` resolved from the connection
  string (the same values used for the resource attributes), instead of the raw configured `server`/`port`.

