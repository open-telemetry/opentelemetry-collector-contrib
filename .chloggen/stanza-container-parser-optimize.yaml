change_type: enhancement

component: pkg/stanza

note: Optimize container parser operator by replacing CRI line regexes with a hand-written scanner and caching log filepath metadata extraction, reducing CPU usage by ~70% on the container parser hot path

issues: [41672]

subtext: |
  The `containerdPattern` and `crioPattern` regexes are replaced by a zero-allocation string scanner (`splitCRI`) that is byte-for-byte equivalent.
  The `logpathPattern` regex on `extractk8sMetaFromFilePath` is replaced by a custom string parser (`splitLogPath`) backed by a configurable LRU cache (new `filepath_cache_size` config option, default 1000).
  End-to-end pprof profiles confirm regexp functions are fully absent from the hot path after this change.

