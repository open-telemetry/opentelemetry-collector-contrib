change_type: enhancement

component: pkg/stanza

note: Optimize container parser operator by replacing CRI line and File path regexes with a hand-written parsers and caching log filepath metadata extraction, reducing CPU usage by ~70% on the container parser hot path

issues: [41672]

subtext: |
  The `containerdPattern` and `crioPattern` regexes are replaced by a string scanner (`parseCRI`) that is byte-for-byte equivalent.
  The `logpathPattern` regex on `extractk8sMetaFromFilePath` is replaced by a custom string parser (`parseLogPath`) backed by a LRU cache with size - 1024.
  Map pools are added in order to reduce memory allocations.

