# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: bug_fix

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/hostmetrics

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: The CPU scraper's utilization calculator is now resilient to virtual CPU core identities changing between scrapes.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [51131]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The way the CPU Utilization used to be calculated, if a CPU core was offlined or its identity changed in `/proc/stat` the
  scraper would fail permanently (or until the original CPU identities came back online). The scraper is resilient against this
  now, updating the known previous CPU times even if cores are missing. Added as part of this change, the CPU scraper is brought
  in line with other scrapers and will only try to calculate at all if the CPU Utilization metric is enabled.

