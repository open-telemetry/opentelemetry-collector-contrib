# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: exporter/signalfx

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Log a debug message instead of dropping datapoints with an invalid metric name, dimension name, dimension value, or number of dimensions, since the backend already enforces these constraints and drops offending datapoints at ingest.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50011]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  With this change, the SignalFx exporter only logs a debug message instead of dropping datapoints with an invalid metric name, 
  dimension name, dimension value, or number of dimensions. 
  The backend already enforces these constraints and drops offending datapoints at ingest. 
  In order to track the number of dropped datapoints, you can monitor your org metrics, mainly [sf.org.numDatapointsDroppedInvalid]
  (https://help.splunk.com/en/splunk-observability-cloud/monitor-infrastructure/metrics-pipeline-management/related-org-metrics-for-metrics-pipeline-management)

# If your change doesn't affect end users or the exported elements of any package,
# you should instead start your pull request title with [chore] or use the "Skip Changelog" label.
# Optional: The change log or logs in which this entry should be included.
# e.g. '[user]' or '[user, api]'
# Include 'user' if the change is relevant to end users.
# Include 'api' if there is a change to a library API.
# Default: '[user]'
change_logs: [user]
