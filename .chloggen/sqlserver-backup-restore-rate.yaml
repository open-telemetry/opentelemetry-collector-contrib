# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: breaking

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/sqlserver

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Report `sqlserver.database.backup_or_restore.rate` as an actual per-second byte rate instead of a running total

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [51546]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The underlying `Backup/Restore Throughput/sec` performance counter is a `PERF_COUNTER_BULK_COUNT`:
  cumulative bytes since instance start, despite the `/sec` in its name. Its raw value was reported
  directly, so the metric was a monotonically increasing lifetime total rather than a rate, and it
  never returned to zero once a backup had run. The rate is now derived from the change between
  consecutive scrapes, which means no value is reported for the first scrape after startup or after
  the counter resets.

  The unit changes from `{backups_or_restores}/s` to `By/s` and the description no longer describes
  the value as a count of backups and restores; the counter measures bytes moved, not operations.

  The counter is reported per database. Each datapoint now carries the `sqlserver.database.name`
  resource attribute; previously the database name was discarded, so every database produced an
  indistinguishable datapoint on the same attribute-less series. The server-wide `_Total` aggregate
  row is no longer emitted, since reporting it alongside the per-database values double-counted when
  summing across databases.

