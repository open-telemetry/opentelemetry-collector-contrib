# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/sqlserver

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add the `db.server.top_procedure` event, reporting aggregated stored procedure statistics.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50799]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Read from `sys.dm_exec_procedure_stats` with per-scrape deltas on the cumulative counters, and
  ranked by the elapsed time each procedure accrued since the previous scrape. Disabled by default;
  configure via the new `top_procedure_collection` block (`max_procedure_sample_count`,
  `top_procedure_count`, `collection_interval`). The event is throttled by its own
  `collection_interval` (default `60s`) rather than the receiver's global one, which also sets the
  window the deltas cover. Correlates with `db.server.top_query` and `db.server.query_sample`
  through the `sqlserver.procedure_id` attribute. Requires `VIEW ANY DEFINITION`, and reports
  `sqlserver.procedure.tempdb.spilled_pages` only on SQL Server 2017 CU3 or later.

