description: Config defines the configuration options for the Grafana Cloud connector.
type: object
properties:
  host_identifiers:
    description: HostIdentifiers defines the list of resource attributes used to derive a unique `grafana.host.id` value. The first attribute present on a span's resource wins, so all telemetry sources reporting the same host must agree on which attribute they emit to avoid counting that host more than once.
    type: array
    items:
      type: string
  metrics_flush_interval:
    type: string
    format: duration
