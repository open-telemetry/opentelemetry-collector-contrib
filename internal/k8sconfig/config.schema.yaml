$defs:
  api_config:
    description: APIConfig contains options relevant to connecting to the K8s API. The alias preserves the parent package's existing API and type identity.
    $ref: ./k8sconfigtypes.api_config
  auth_type:
    description: AuthType describes the type of authentication to use for the K8s API. It is defined in the light k8sconfigtypes package so config schemas can reference it without depending on k8s.io/client-go.
    $ref: ./k8sconfigtypes.auth_type
