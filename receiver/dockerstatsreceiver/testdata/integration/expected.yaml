resourceMetrics:
  - resource:
      attributes:
        - key: container.hostname
          value:
            stringValue: 945d6961c1fd
        - key: container.id
          value:
            stringValue: 945d6961c1fd6a4055b7683138c94306c966171737da7dbd570e44f2d09a53e0
        - key: container.image.name
          value:
            stringValue: docker.io/library/nginx:1.17
        - key: container.name
          value:
            stringValue: dockerstatsreceiver-test
        - key: container.runtime
          value:
            stringValue: docker
    schemaUrl: https://opentelemetry.io/schemas/1.40.0
    scopeMetrics:
      - metrics:
          - description: Time spent by tasks of the cgroup in kernel mode (Linux).  Time spent by all container processes in kernel mode (Windows).
            name: container.cpu.usage.kernelmode
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "6336000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: ns
          - description: Total CPU time consumed.
            name: container.cpu.usage.total
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "25345000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: ns
          - description: Time spent by tasks of the cgroup in user mode (Linux).  Time spent by all container processes in user mode (Windows).
            name: container.cpu.usage.usermode
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "19008000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: ns
          - description: Percent of CPU used by the container.
            gauge:
              dataPoints:
                - asDouble: 7.090644000852164e-05
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: container.cpu.utilization
            unit: "1"
          - description: The health status of the container.
            gauge:
              dataPoints:
                - asInt: "0"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: container.health.status
          - description: Amount of memory used to cache filesystem data, including tmpfs and shared memory (Only available with cgroups v2).
            name: container.memory.file
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "12288"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: Percentage of memory used. Not supported on Windows.
            gauge:
              dataPoints:
                - asDouble: 0.004607556098422618
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: container.memory.percent
            unit: "1"
          - description: Memory limit of the container. Not supported on Windows.
            name: container.memory.usage.limit
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "50227060736"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: Memory usage of the container. This excludes the cache.
            name: container.memory.usage.total
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "2314240"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: Bytes received by the container.
            name: container.network.io.usage.rx_bytes
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "752"
                  attributes:
                    - key: interface
                      value:
                        stringValue: eth0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: By
          - description: Incoming packets dropped.
            name: container.network.io.usage.rx_dropped
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  attributes:
                    - key: interface
                      value:
                        stringValue: eth0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{packets}'
          - description: Bytes sent.
            name: container.network.io.usage.tx_bytes
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "84"
                  attributes:
                    - key: interface
                      value:
                        stringValue: eth0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: By
          - description: Outgoing packets dropped.
            name: container.network.io.usage.tx_dropped
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  attributes:
                    - key: interface
                      value:
                        stringValue: eth0
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: '{packets}'
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver
          version: latest
