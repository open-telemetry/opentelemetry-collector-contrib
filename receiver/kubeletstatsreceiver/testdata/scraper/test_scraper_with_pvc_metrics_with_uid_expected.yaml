resourceMetrics:
  - resource:
      attributes:
        - key: k8s.namespace.name
          value:
            stringValue: default
        - key: k8s.node.name
          value:
            stringValue: worker-1
        - key: k8s.persistentvolumeclaim.name
          value:
            stringValue: shared-data
        - key: k8s.persistentvolumeclaim.uid
          value:
            stringValue: shared-data
    schemaUrl: https://opentelemetry.io/schemas/1.43.0
    scopeMetrics:
      - metrics:
          - description: The number of available bytes in the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.available
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "7000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: The total capacity in bytes of the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.capacity
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "10000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
          - description: The total inodes in the filesystem of the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.inode.count
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: '{inode}'
          - description: The free inodes in the filesystem of the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.inode.free
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "900"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: '{inode}'
          - description: The inodes used by the filesystem of the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.inode.used
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "100"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: '{inode}'
          - description: The number of used bytes in the volume backing the PersistentVolumeClaim. Values are reported by the volume plugin; for statfs-based plugins (e.g. local) they describe the backing filesystem rather than the claim's requested capacity.
            name: k8s.persistentvolumeclaim.volume.usage
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "3000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: By
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver
          version: latest
  - resource:
      attributes:
        - key: k8s.namespace.name
          value:
            stringValue: default
        - key: k8s.pod.name
          value:
            stringValue: web-0
        - key: k8s.pod.uid
          value:
            stringValue: pod-uid-web-0
        - key: k8s.volume.name
          value:
            stringValue: cache
    schemaUrl: https://opentelemetry.io/schemas/1.43.0
    scopeMetrics:
      - metrics:
          - description: The number of available bytes in the volume.
            gauge:
              dataPoints:
                - asInt: "500"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.volume.available
            unit: By
          - description: The total capacity in bytes of the volume.
            gauge:
              dataPoints:
                - asInt: "1000"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.volume.capacity
            unit: By
          - description: The total inodes in the filesystem.
            gauge:
              dataPoints:
                - asInt: "100"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.volume.inodes
            unit: "1"
          - description: The free inodes in the filesystem.
            gauge:
              dataPoints:
                - asInt: "90"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.volume.inodes.free
            unit: "1"
          - description: The inodes used by the filesystem. This may not equal inodes - free because filesystem may share inodes with other filesystems.
            gauge:
              dataPoints:
                - asInt: "10"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.volume.inodes.used
            unit: "1"
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver
          version: latest
