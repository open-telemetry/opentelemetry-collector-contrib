resourceMetrics:
  - resource:
      attributes:
        - key: k8s.namespace.name
          value:
            stringValue: kube-system
        - key: k8s.pod.name
          value:
            stringValue: kube-scheduler-minikube
        - key: k8s.pod.uid
          value:
            stringValue: 5795d0c442cb997ff93c49feeb9f6386
    schemaUrl: https://opentelemetry.io/schemas/1.44.0
    scopeMetrics:
      - metrics:
          - description: The ratio of Pod CPU usage to its current CPU limit.
            gauge:
              dataPoints:
                - asDouble: 0.90502575
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.pod.cpu.limit.utilization
            unit: "1"
          - description: The ratio of Pod CPU usage to its current CPU request.
            gauge:
              dataPoints:
                - asDouble: 1.8100515
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.pod.cpu.request.utilization
            unit: "1"
          - description: Pod cpu utilization as a ratio of the pod's total container limits. If any container is missing a limit the metric is not emitted.
            gauge:
              dataPoints:
                - asDouble: 0.90502575
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: k8s.pod.cpu_limit_utilization
