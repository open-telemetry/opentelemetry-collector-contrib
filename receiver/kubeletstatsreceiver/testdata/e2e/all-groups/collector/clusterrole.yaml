apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Name }}
  labels:
    app: {{ .Name }}
rules:
  # nodes/stats: kubelet /stats/summary; nodes/proxy: kubelet /pods
  # (needed for extra_metadata_labels); nodes get/list/watch: node informer
  # used by the *.node.utilization metrics.
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/stats
      - nodes/proxy
    verbs:
      - get
      - list
      - watch
