version: 1
signal: metrics
# Both gates disabled: only the v0 form is emitted, as a gauge.
# Only the four migrated container memory metrics are asserted; the rest of
# the container metric set is covered by the all-groups case.
resources/include:
    - attributes/include:
        k8s.namespace.name: default
        k8s.pod.name: kubeletstats-e2e-workload
        k8s.container.name: workload
      scopes/include:
        - name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver
          version/exists: true
          metrics/include:
            - name: container.memory.available
              type: gauge
              unit: By
            - name: container.memory.rss
              type: gauge
              unit: By
            - name: container.memory.usage
              type: gauge
              unit: By
            - name: container.memory.working_set
              type: gauge
              unit: By
