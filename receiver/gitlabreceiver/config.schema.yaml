$defs:
  gitlab_headers:
    type: object
    properties:
      Customizable:
        type: object
        additionalProperties:
          type: string
      Fixed:
        type: object
        additionalProperties:
          type: string
  web_hook:
    type: object
    properties:
      health_path:
        type: string
      include_user_attributes:
        description: 'Deprecated: [v0.162.0] Use resource_attributes.<name>.enabled instead. When true, enables the user resource attributes (vcs.ref.head.revision.author.name, vcs.ref.head.revision.author.email, vcs.ref.head.revision.message, cicd.pipeline.run.actor.id, cicd.pipeline.run.actor.name, gitlab.pipeline.run.actor.username), overriding their resource_attributes setting.'
        type: boolean
      path:
        type: string
      required_headers:
        type: object
        additionalProperties:
          $ref: go.opentelemetry.io/collector/config/configopaque.string
      secret:
        type: string
    allOf:
      - $ref: go.opentelemetry.io/collector/config/confighttp.server_config
      - $ref: gitlab_headers
description: Config that is exposed to this gitlab receiver through the OTEL config.yaml
type: object
properties:
  resource_attributes:
    description: ResourceAttributes controls which resource attributes are emitted.
    $ref: ./internal/metadata.resource_attributes_config
  webhook:
    $ref: web_hook
