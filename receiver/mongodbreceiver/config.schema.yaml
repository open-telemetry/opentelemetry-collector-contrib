$defs:
  query_sample_collection:
    type: object
    properties:
      max_rows_per_query:
        type: integer
        x-customType: uint64
  top_query_collection:
    description: TopQueryCollection holds configuration for the db.server.top_query log event collection.
    type: object
    properties:
      collection_interval:
        description: CollectionInterval controls how often top_query scrapes run, independent of the receiver's main collection_interval. Setting this smaller than collection_interval has no effect since the controller only ticks at collection_interval. 0 disables the self-gate — top_query runs on every controller tick.
        type: string
        format: duration
      max_explain_each_interval:
        description: MaxExplainEachInterval caps the number of new explain calls per scrape interval. Cache hits do not count toward this budget; only server-side explain calls do.
        type: integer
        x-customType: int64
      max_query_sample_count:
        description: MaxQuerySampleCount bounds the number of profile documents fetched per database per scrape before ranking. TopQueryCount must be <= MaxQuerySampleCount.
        type: integer
        x-customType: int64
      query_plan_cache_size:
        description: QueryPlanCacheSize is the maximum number of explain plans to cache. 0 means explain runs on every occurrence but results are not cached.
        type: integer
      query_plan_cache_ttl:
        description: QueryPlanCacheTTL is the TTL for cached explain plans.
        type: string
        format: duration
      top_query_count:
        description: TopQueryCount is the number of top queries to emit per scrape (ranked by execution time). 0 means no events are emitted (cursors still advance).
        type: integer
        x-customType: int64
type: object
properties:
  auth_mechanism:
    type: string
  auth_mechanism_properties:
    type: object
    additionalProperties:
      type: string
  auth_source:
    type: string
  direct_connection:
    type: boolean
  hosts:
    description: Deprecated - Transport option will be removed in v0.102.0
    type: array
    items:
      $ref: go.opentelemetry.io/collector/config/confignet.tcp_addr_config
  password:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  query_sample_collection:
    $ref: query_sample_collection
  replica_set:
    type: string
  scheme:
    type: string
  timeout:
    type: string
    format: duration
  top_query_collection:
    $ref: top_query_collection
  username:
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: go.opentelemetry.io/collector/config/configtls.client_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
