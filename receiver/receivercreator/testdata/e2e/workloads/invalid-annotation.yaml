apiVersion: v1
kind: Pod
metadata:
  name: receivercreator-e2e-invalid-annotation
  namespace: default
  labels:
    app: receivercreator-e2e-workload
  annotations:
    fluentbit.io/parser: level-seq
    io.opentelemetry.discovery.metrics/enabled: "true"
    io.opentelemetry.discovery.metrics/scraper: nginx
    io.opentelemetry.discovery.metrics/config: "collection_interval: [unclosed"
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - /bin/sh
        - -c
        - i=0; while true; do echo "2026-01-01T00:00:00Z INFO seq=$i message from invalid-annotation"; i=$((i+1)); sleep 1; done
      ports:
        - containerPort: 8081
        - containerPort: 8082
        - containerPort: 8083
        - containerPort: 8084
        - containerPort: 8085
