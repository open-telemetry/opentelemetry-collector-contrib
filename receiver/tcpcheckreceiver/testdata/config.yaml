receivers:
  tcp_check:
    collection_interval: 1m
    initial_delay: 1s
    targets:
      - endpoint: "google.com:443"
        dialer:
          timeout: 3s
      - endpoint: "localhost:8080"
        dialer:
          timeout: 5s
      - endpoint: "localhost:6379"
        dialer:
          timeout: 5s
        max_response_bytes: 1024
        query_response:
          - send: "PING\r\n"
          - expect: "^\\+PONG"
          - send_bytes: "AQID"
            expect_bytes: "BAUG"
