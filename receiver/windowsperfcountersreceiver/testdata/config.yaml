windows_perf_counters/customname:
  metrics:
    metric:
      description: desc
      unit: "1"
      gauge:
    metric2:
      description: desc
      unit: "1"
      gauge:
  collection_interval: 30s
  perfcounters:
    - object: object1
      instances: ["*", "_Global_"]
      aggregation_name: "_Global_"
      counters:
        - name: counter1
          metric: metric
    - object: object2
      counters:
        - name: counter1
          metric: metric
        - name: counter2
          metric: metric2

