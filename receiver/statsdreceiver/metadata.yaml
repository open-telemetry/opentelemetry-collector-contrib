display_name: StatsD Receiver
type: statsd

description: |
  StatsD receiver for ingesting StatsD messages(https://github.com/statsd/statsd/blob/master/docs/metric_types.md) into
  the OpenTelemetry Collector. Note: This receiver does not support horizontally scaled collector deployments. It is
  intended to run in agent mode, where a single collector instance receives StatsD input.

status:
  class: receiver
  stability:
    beta: [metrics]
  distributions: [contrib]
  codeowners:
    active: [jmacd, dmitryax]

# Feature gate controlling the default value of the is_monotonic_counter option.
# When enabled, statsd counters default to monotonic (matching real-world statsd semantics)
# instead of the legacy non-monotonic default.
feature_gates:
  - id: receiver.statsd.monotonicCounterDefault
    stage: alpha
    description: >-
      When enabled, changes the default value of is_monotonic_counter to true, so that statsd
      counters are treated as monotonic sums by default. Explicitly setting is_monotonic_counter
      in the receiver config always takes precedence over this feature gate.
    from_version: v0.159.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/14956

telemetry:
  metrics:
    receiver_received_statsd_metrics:
      enabled: true
      description: Number of statsd metrics received.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
