display_name: Prometheus Remote Write Receiver
type: prometheus_remote_write
deprecated_type: prometheusremotewrite

description: |
  This receiver implements the
  [Prometheus Remote Write 2.0 protocol](https://prometheus.io/docs/specs/prw/remote_write_spec_2_0/).

status:
  class: receiver
  stability:
    alpha: [metrics]
  distributions: [contrib]
  codeowners:
    active: [dashpole, ArthurSens, perebaj, himanshu130700]
telemetry:
  metrics:
    receiver_prometheusremotewrite_resource_cache_evictions:
      enabled: true
      description: Number of job/instance entries evicted from the resource metrics cache because it was full.
      stability: development
      unit: "{entries}"
      sum:
        value_type: int
        monotonic: true

tests:
  config:
  goleak:
    ignore:
      top:
        # See https://github.com/census-instrumentation/opencensus-go/issues/1191 for more information.
        - "go.opencensus.io/stats/view.(*worker).start"
