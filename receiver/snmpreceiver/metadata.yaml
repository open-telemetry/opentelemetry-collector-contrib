display_name: SNMP Receiver
type: snmp

description: |
  This receiver fetches stats from an SNMP enabled host using a [golang
  snmp client](https://github.com/gosnmp/gosnmp). Metrics are collected
  based upon different configurations in the config file. Optionally,
  SNMP notifications are received over UDP and emitted as logs.

status:
  class: receiver
  stability:
    alpha: [metrics]
    development: [logs]
  distributions: [contrib]
  codeowners:
    active: [ajimenez1503, svencowart]
    emeritus: [StefanKurek, tamir-michaeli]

tests:
  config:
    traps:
      listen_address: 127.0.0.1:0
    poll:
      metrics:
        m1:
          unit: "1"
          gauge:
            value_type: int
          scalar_oids:
            - oid: ".1"
