kafka/legacy_topic:
  metrics:
    topic: legacy_metric
    encoding: otlp_proto
  traces:
    topic: legacy_spans
    encoding: otlp_proto
  logs:
    topic: legacy_logs
    encoding: otlp_proto
  profiles:
    topic: legacy_profile
    encoding: otlp_proto
    
kafka/logs:
  logs:
    topics: 
    - logs
    encoding: direct
  session_timeout: 45s
  heartbeat_interval: 15s
  brokers:
    - "coffee:123"
    - "foobar:456"
  client_id: otel-collector
  group_id: otel-collector
  initial_offset: earliest
  auth:
    sasl:
      mechanism: PLAIN
      username: user
      password: password
  tls:
    ca_file: ca.pem
    cert_file: cert.pem
    key_file: key.pem
  metadata:
    retry:
      max: 10
      backoff: 5s
  error_backoff:
    enabled: true
    initial_interval: 1s
    max_interval: 10s
    max_elapsed_time: 1m
    multiplier: 1.5

kafka/rebalance_strategies:
  group_rebalance_strategies:
    - cooperative-sticky
    - my_balancer

kafka/message_marking:
  message_marking:
    after: true
    on_error: true
    on_permanent_error: false

kafka/message_marking_not_specified:

kafka/message_marking_on_permanent_error_inherited:
  message_marking:
    after: true
    on_error: true

kafka/regex_topic_with_exclusion:
  logs:
    topics:
    - "^logs-.*"
    exclude_topics:
    - "^logs-(test|dev)$"
    encoding: otlp_proto
  metrics:
    topics:
    - "^metrics-.*"
    exclude_topics:
    - "^metrics-internal-.*$"
    encoding: otlp_proto
  traces:
    topics:
    - "^traces-.*"
    exclude_topics:
    - "^traces-debug-.*$"
    encoding: otlp_proto

kafka/conn_idle_timeout:
  conn_idle_timeout: 5m

kafka/valid_exclude_topics_logs:
  logs:
    topics:
    - "^logs-.*"
    exclude_topics:
    - "^logs-test$"
    encoding: otlp_proto

kafka/valid_logs_without_exclude:
  logs:
    topics:
    - logs
    encoding: otlp_proto

kafka/partition_processing:
  partition_processing:
    independent: true
    max_buffered_batches: 2

kafka/invalid_exclude_topics_logs_non_regex:
  logs:
    topics:
    - logs
    exclude_topics:
    - "^logs-test$"
    encoding: otlp_proto

kafka/invalid_exclude_topics_metrics_non_regex:
  metrics:
    topics:
    - metrics
    exclude_topics:
    - "^metrics-test$"
    encoding: otlp_proto

kafka/invalid_exclude_topics_traces_non_regex:
  traces:
    topics:
    - traces
    exclude_topics:
    - "^traces-test$"
    encoding: otlp_proto

kafka/invalid_exclude_topics_profiles_non_regex:
  profiles:
    topics:
    - profiles
    exclude_topics:
    - "^profiles-test$"
    encoding: otlp_proto

kafka/invalid_exclude_topics_regex:
  logs:
    topics:
    - "^logs-.*"
    exclude_topics:
    - "^logs-[invalid(regex"
    encoding: otlp_proto

kafka/invalid_exclude_topics_logs_empty:
  logs:
    topics:
    - "^logs-.*"
    exclude_topics:
    - ""
    encoding: otlp_proto

kafka/invalid_exclude_topics_metrics_empty:
  metrics:
    topics:
    - "^metrics-.*"
    exclude_topics:
    - ""
    - "^metrics-test$"
    encoding: otlp_proto

kafka/invalid_exclude_topics_traces_empty:
  traces:
    topics:
    - "^traces-.*"
    exclude_topics:
    - "^traces-test$"
    - ""
    encoding: otlp_proto

kafka/invalid_exclude_topics_profiles_empty:
  profiles:
    topics:
    - "^profiles-.*"
    exclude_topics:
    - ""
    encoding: otlp_proto

kafka/invalid_partition_processing_zero_buffered_batches:
  partition_processing:
    independent: true
    max_buffered_batches: 0

kafka/invalid_partition_processing_manual_commit:
  autocommit:
    enable: false
  partition_processing:
    independent: true
