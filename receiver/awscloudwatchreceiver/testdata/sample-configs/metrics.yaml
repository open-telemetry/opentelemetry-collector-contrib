receivers:
  aws_cloudwatch:
    region: us-west-2
    # profile: <your profile name>
    metrics:
      collection_interval: 5m
      period: 300s
      discovery:
        filters:
          - namespace: AWS/EC2
            metric_names: [CPUUtilization, NetworkIn, NetworkOut]
            stats: [Average, Maximum]
          - namespace: AWS/EC2
            metric_names: [StatusCheckFailed_Instance]
            # no stats → Summary of Sum, SampleCount, Minimum, Maximum
          - namespace: AWS/RDS
            # no metric_names → all metrics in the namespace
        limit: 50
