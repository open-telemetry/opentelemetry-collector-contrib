display_name: Apache Web Server Receiver
type: apache

description: |
  The Apache Web Server Receiver fetches stats from an Apache Web Server instance using the `server-status?auto` endpoint.

status:
  class: receiver
  stability:
    beta: [metrics]
  distributions: [contrib]
  codeowners:
    active: [colelaven, ishleenk17]
    emeritus: [djaglowski]

resource_attributes:
  apache.server.name:
    description: The name of the Apache HTTP server.
    type: string
    enabled: true
  apache.server.port:
    description: The port of the Apache HTTP server.
    type: string
    enabled: true

# Feature gates controlling the migration to the new, consistent metric and attribute
# names. See the migration guide linked from the component README for details.
# Default behavior (both gates disabled) emits the original names only.
feature_gates:
  - id: receiver.apache.disableOldFormatMetrics
    stage: alpha
    description: >-
      When enabled, the receiver no longer emits the original metric and attribute names
      (e.g. apache.requests, apache.scoreboard, and the mode/level/state attributes).
      Requires receiver.apache.enableNewFormatMetrics to also be enabled.
    from_version: v0.159.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47327
  - id: receiver.apache.enableNewFormatMetrics
    stage: alpha
    description: >-
      When enabled, the receiver emits the new, consistently named metrics and attributes
      (e.g. apache.request.count, apache.worker.status, cpu.mode) alongside the original ones.
      See the migration guide linked from the component README for the full mapping.
    from_version: v0.159.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47327

# Attributes marked (new) are emitted when receiver.apache.enableNewFormatMetrics is enabled.
# All others are the original attributes, emitted by default.
attributes:
  apache.connection.state: # (new)
    description: The asynchronous connection state reported by Apache's server-status.
    type: string
    requirement_level: recommended
    enum:
      - writing
      - keepalive
      - closing
  apache.worker.state: # (new)
    description: The state of a worker.
    type: string
    requirement_level: recommended
    enum:
      - open
      - waiting
      - starting
      - reading
      - sending
      - keepalive
      - dnslookup
      - closing
      - logging
      - finishing
      - idle_cleanup
      - unknown
  connection_state:
    description: The asynchronous connection state reported by Apache's server-status.
    type: string
    requirement_level: recommended
    enum:
      - writing
      - keepalive
      - closing
  cpu_level:
    name_override: level
    description: Level of processes.
    type: string
    requirement_level: recommended
    enum:
      - self
      - children
  cpu_mode:
    name_override: mode
    description: Mode of processes.
    type: string
    requirement_level: recommended
    enum:
      - system
      - user
  scoreboard_state:
    name_override: state
    description: The state of a connection.
    type: string
    requirement_level: recommended
    enum:
      - open
      - waiting
      - starting
      - reading
      - sending
      - keepalive
      - dnslookup
      - closing
      - logging
      - finishing
      - idle_cleanup
      - unknown
  workers_state:
    name_override: state
    description: The state of workers.
    type: string
    requirement_level: recommended
    enum:
      - busy
      - idle

# Metrics marked (new) are emitted when receiver.apache.enableNewFormatMetrics is enabled.
# Metrics marked (old) are emitted by default and suppressed by receiver.apache.disableOldFormatMetrics.
# Unmarked metrics are always emitted.
metrics:
  apache.connection.active: # (new)
    enabled: true
    stability: development
    description: The number of active connections currently attached to the HTTP server.
    unit: "{connection}"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []
  apache.connection.status: # (new)
    enabled: true
    stability: development
    description: The number of connections in different asynchronous states reported by Apache's server-status.
    # Modeled as a status metric per
    # https://opentelemetry.io/docs/specs/semconv/how-to-write-conventions/status-metrics/
    unit: "1"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [apache.connection.state]
  apache.connections.async: # (old)
    enabled: true
    stability: development
    description: The number of connections in different asynchronous states reported by Apache's server-status.
    unit: "{connections}"
    gauge:
      value_type: int
      input_type: string
    attributes: [connection_state]
  apache.cpu.load:
    enabled: true
    stability: development
    description: Current load of the CPU.
    unit: "%"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.cpu.time:
    enabled: true
    stability: development
    description: Jiffs used by processes of given category.
    unit: "{jiff}"
    sum:
      value_type: double
      input_type: string
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [cpu_level, cpu_mode]
  apache.current_connections: # (old)
    enabled: true
    stability: development
    description: The number of active connections currently attached to the HTTP server.
    unit: "{connections}"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []
  apache.load.1:
    enabled: true
    stability: development
    description: The average server load during the last minute.
    unit: "%"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.load.15:
    enabled: true
    stability: development
    description: The average server load during the last 15 minutes.
    unit: "%"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.load.5:
    enabled: true
    stability: development
    description: The average server load during the last 5 minutes.
    unit: "%"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.request.count: # (new)
    enabled: true
    stability: development
    description: The number of requests serviced by the HTTP server.
    unit: "{request}"
    sum:
      value_type: int
      input_type: string
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []
  apache.request.rate:
    enabled: false
    stability: development
    description: Average number of requests served per second since the server was started, as reported by mod_status.
    unit: "{request}/s"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.request.time:
    enabled: true
    stability: development
    description: Total time spent on handling requests.
    unit: ms
    sum:
      value_type: int
      input_type: string
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []
  apache.requests: # (old)
    enabled: true
    stability: development
    description: The number of requests serviced by the HTTP server per second.
    unit: "{requests}"
    sum:
      value_type: int
      input_type: string
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []
  apache.scoreboard: # (old)
    enabled: true
    stability: development
    description: The number of workers in each state.
    extended_documentation: >-
      The [apache scoreboard](https://metacpan.org/pod/Apache::Scoreboard#DESCRIPTION)
      is an encoded representation of the state of all the server's workers.
      This metric decodes the scoreboard and presents a count of workers in each state.
    unit: "{workers}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [scoreboard_state]
  apache.traffic:
    enabled: true
    stability: development
    description: Total HTTP server traffic.
    unit: By
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []
  apache.traffic.rate:
    enabled: false
    stability: development
    description: Average number of bytes transmitted per second since the server was started, as reported by mod_status.
    unit: "By/s"
    gauge:
      value_type: double
      input_type: string
    attributes: []
  apache.uptime:
    enabled: true
    stability: development
    description: The amount of time that the server has been running in seconds.
    unit: s
    sum:
      value_type: int
      input_type: string
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []
  apache.worker.active: # (new)
    enabled: true
    stability: development
    description: The number of busy workers currently attached to the HTTP server.
    unit: "{worker}"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []
  apache.worker.idle: # (new)
    enabled: true
    stability: development
    description: The number of idle workers currently attached to the HTTP server.
    unit: "{worker}"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []
  apache.worker.limit:
    enabled: true
    stability: development
    description: The maximum number of worker slots configured for the HTTP server, derived from the scoreboard length.
    unit: "{worker}"
    sum:
      value_type: int
      aggregation_temporality: cumulative
      monotonic: false
    attributes: []
  apache.worker.status: # (new)
    enabled: true
    stability: development
    description: The number of workers in each state.
    extended_documentation: >-
      The [apache scoreboard](https://metacpan.org/pod/Apache::Scoreboard#DESCRIPTION)
      is an encoded representation of the state of all the server's workers.
      This metric decodes the scoreboard and presents a count of workers in each state.
    # Modeled as a status metric per
    # https://opentelemetry.io/docs/specs/semconv/how-to-write-conventions/status-metrics/
    unit: "1"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [apache.worker.state]
  apache.workers: # (old)
    enabled: true
    stability: development
    description: The number of workers currently attached to the HTTP server.
    unit: "{workers}"
    sum:
      value_type: int
      input_type: string
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [workers_state]
