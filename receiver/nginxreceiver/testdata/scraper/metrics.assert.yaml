version: 1
signal: metrics
resources:
    - scopes:
        - name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/nginxreceiver
          version: latest
          metrics:
            - name: nginx.connections_accepted
              type: sum
              unit: '{connections}'
              temporality: cumulative
              monotonic: true
              datapoints:
                - int_value: 16630948
            - name: nginx.connections_current
              type: sum
              unit: '{connections}'
              temporality: cumulative
              monotonic: false
              datapoints:
                - attributes:
                    state: active
                  int_value: 291
                - attributes:
                    state: reading
                  int_value: 6
                - attributes:
                    state: waiting
                  int_value: 106
                - attributes:
                    state: writing
                  int_value: 179
            - name: nginx.connections_handled
              type: sum
              unit: '{connections}'
              temporality: cumulative
              monotonic: true
              datapoints:
                - int_value: 16630946
            - name: nginx.requests
              type: sum
              unit: '{requests}'
              temporality: cumulative
              monotonic: true
              datapoints:
                - int_value: 31070465
