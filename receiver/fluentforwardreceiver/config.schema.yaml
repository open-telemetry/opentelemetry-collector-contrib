description: Config defines configuration for the fluentforward receiver.
type: object
properties:
  endpoint:
    description: The address to listen on for incoming Fluent Forward events.  Should be of the form `<ip addr>:<port>` (TCP) or `unix://<socket_path>` (Unix domain socket).
    type: string
  max_connections:
    description: MaxConnections caps simultaneously open connections. Connections over the cap wait in the accept backlog until a slot frees. 0 means no limit.
    type: integer
