$defs:
  auth_type:
    description: AuthType selects how the receiver authenticates to the Oracle database.
    type: string
  kerberos_config:
    description: KerberosConfig configures Kerberos (GSSAPI) authentication to the Oracle database. It applies only when the top-level `auth_type` is set to `kerberos`. The receiver acquires a Kerberos ticket-granting ticket from the configured credential source and presents an AP-REQ to the database over Oracle Net's advanced negotiation layer; no username/password is sent.
    type: object
    properties:
      config_file:
        description: ConfigFile is the path to the krb5.conf configuration file.
        type: string
      credential_cache:
        description: CredentialCache is the path to the credential cache. Used when credential_type is `ccache`.
        type: string
      credential_type:
        description: 'CredentialType selects how the Kerberos client obtains its credentials: `keytab`, `ccache`, or `password`.'
        $ref: kerberos_credential_type
      disable_fast_negotiation:
        description: DisableFASTNegotiation disables PA-FX-FAST pre-authentication. Set to true when the KDC does not support FAST.
        type: boolean
      keytab_file:
        description: KeytabFile is the path to the keytab file. Used when credential_type is `keytab`.
        type: string
      password:
        description: Password is the principal's password. Used when credential_type is `password`.
        $ref: go.opentelemetry.io/collector/config/configopaque.string
      principal:
        description: Principal is the client principal name, without the realm (e.g. otel).
        type: string
      realm:
        description: Realm is the Kerberos realm of the principal (e.g. EXAMPLE.COM).
        type: string
  kerberos_credential_type:
    description: KerberosCredentialType selects how the Kerberos client obtains its credentials.
    type: string
  query_sample:
    type: object
    properties:
      allowed_comment_keys:
        type: array
        items:
          type: string
      max_rows_per_query:
        type: integer
        x-customType: uint64
  session_wait_event:
    type: object
    properties:
      max_rows_per_query:
        type: integer
        x-customType: uint64
  top_query_collection:
    type: object
    properties:
      allowed_comment_keys:
        type: array
        items:
          type: string
      collection_interval:
        type: string
        format: duration
      max_query_sample_count:
        type: integer
        x-customType: uint
      top_query_count:
        type: integer
        x-customType: uint
type: object
properties:
  auth_type:
    $ref: auth_type
  datasource:
    type: string
  endpoint:
    type: string
  kerberos:
    x-pointer: true
    $ref: kerberos_config
  password:
    type: string
  query_sample_collection:
    $ref: query_sample
  service:
    type: string
  session_wait_event_collection:
    $ref: session_wait_event
  top_query_collection:
    $ref: top_query_collection
  username:
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
