resourceMetrics:
  - resource:
      attributes:
        - key: host.name
          value:
            stringValue: 0.0.0.0
        - key: server.address
          value:
            stringValue: 0.0.0.0
        - key: server.port
          value:
            intValue: "1433"
        - key: service.instance.id
          value:
            stringValue: 0.0.0.0:1433
        - key: service.name
          value:
            stringValue: unknown_service:microsoft.sql_server
        - key: service.namespace
          value:
            stringValue: ""
        - key: sqlserver.instance.name
          value:
            stringValue: testhost
    scopeMetrics:
      - metrics:
          - description: TempDB space usage, broken down by state.
            name: sqlserver.database.tempdb.space
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "4096"
                  attributes:
                    - key: tempdb.state
                      value:
                        stringValue: internal_objects
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "8192"
                  attributes:
                    - key: tempdb.state
                      value:
                        stringValue: user_objects
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            unit: kBy
          - description: Cumulative wait time on tempdb allocation pages, broken down by page type.
            name: sqlserver.tempdb.allocation.wait_time.total
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asDouble: 0.15
                  attributes:
                    - key: sqlserver.tempdb.allocation.page_type
                      value:
                        stringValue: gam
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asDouble: 0.005
                  attributes:
                    - key: sqlserver.tempdb.allocation.page_type
                      value:
                        stringValue: other
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asDouble: 0.01
                  attributes:
                    - key: sqlserver.tempdb.allocation.page_type
                      value:
                        stringValue: pfs
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asDouble: 0.025
                  attributes:
                    - key: sqlserver.tempdb.allocation.page_type
                      value:
                        stringValue: sgam
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: s
          - description: Number of tempdb pagelatch wait types with at least one active waiter.
            gauge:
              dataPoints:
                - asInt: "2"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.tempdb.contention.waiters.count
            unit: '{waiters}'
          - description: Number of tempdb data files configured on the instance.
            gauge:
              dataPoints:
                - asInt: "4"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.tempdb.data_files.count
            unit: '{files}'
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
          version: latest
