resourceMetrics:
  - resource:
      attributes:
        - key: host.name
          value:
            stringValue: 0.0.0.0
        - key: service.instance.id
          value:
            stringValue: 0.0.0.0:1433
        - key: service.name
          value:
            stringValue: unknown_service:microsoft.sql_server
        - key: service.namespace
          value:
            stringValue: ""
        - key: sqlserver.instance.name
          value:
            stringValue: testhost
    scopeMetrics:
      - metrics:
          - description: System-wide CPU utilization as observed by the SQL Server scheduler monitor. This reflects host-wide CPU usage, not the SQL Server process alone.
            gauge:
              dataPoints:
                - asDouble: 42.5
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.cpu.utilization
            unit: '%'
          - description: Physical memory on the host as observed by SQL Server, broken down by state (total or available).
            gauge:
              dataPoints:
                - asInt: "8589934592"
                  attributes:
                    - key: memory.state
                      value:
                        stringValue: available
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "17179869184"
                  attributes:
                    - key: memory.state
                      value:
                        stringValue: total
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.memory.physical
            unit: By
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
          version: latest
