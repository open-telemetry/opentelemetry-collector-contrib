resourceMetrics:
  - resource:
      attributes:
        - key: host.name
          value:
            stringValue: 0.0.0.0
        - key: server.address
          value:
            stringValue: 0.0.0.0
        - key: server.port
          value:
            intValue: "1433"
        - key: service.instance.id
          value:
            stringValue: 0.0.0.0:1433
        - key: service.name
          value:
            stringValue: unknown_service:microsoft.sql_server
        - key: service.namespace
          value:
            stringValue: ""
        - key: sqlserver.instance.name
          value:
            stringValue: testhost
    scopeMetrics:
      - metrics:
          - description: Cumulative bytes read from and written to files backing SQL Server databases. Counters reset when the file becomes unavailable (detached, taken offline, or database restart).
            name: sqlserver.disk.io
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "1258291200"
                  attributes:
                    - key: disk.io.direction
                      value:
                        stringValue: read
                    - key: sqlserver.file.path.prefix
                      value:
                        stringValue: C:\
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "629145600"
                  attributes:
                    - key: disk.io.direction
                      value:
                        stringValue: write
                    - key: sqlserver.file.path.prefix
                      value:
                        stringValue: C:\
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: By
          - description: Cumulative read and write operations on files backing SQL Server databases. Counters reset when the file becomes unavailable (detached, taken offline, or database restart).
            name: sqlserver.disk.operations
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "12345"
                  attributes:
                    - key: disk.io.direction
                      value:
                        stringValue: read
                    - key: sqlserver.file.path.prefix
