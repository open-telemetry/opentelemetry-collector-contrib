resourceMetrics:
  - resource:
      attributes:
        - key: host.name
          value:
            stringValue: 0.0.0.0
        - key: server.address
          value:
            stringValue: 0.0.0.0
        - key: server.port
          value:
            intValue: "1433"
        - key: service.instance.id
          value:
            stringValue: 0.0.0.0:1433
        - key: service.name
          value:
            stringValue: unknown_service:microsoft.sql_server
        - key: service.namespace
          value:
            stringValue: ""
        - key: sqlserver.instance.name
          value:
            stringValue: testhost
    scopeMetrics:
      - metrics:
          - description: System-wide CPU utilization on the host that SQL Server is running on, expressed as a fraction between 0 and 1.
            gauge:
              dataPoints:
                - asDouble: 0.425
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.cpu.utilization
            unit: "1"
          - description: Total physical memory installed on the host as observed by SQL Server.
            gauge:
              dataPoints:
                - asInt: "17179869184"
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.host.memory.limit
            unit: By
          - description: Physical memory usage on the host as observed by SQL Server, broken down by state.
            gauge:
              dataPoints:
                - asInt: "8589934592"
                  attributes:
                    - key: system.memory.state
                      value:
                        stringValue: free
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "8589934592"
                  attributes:
                    - key: system.memory.state
                      value:
                        stringValue: used
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
            name: sqlserver.host.memory.usage
            unit: By
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
          version: latest
