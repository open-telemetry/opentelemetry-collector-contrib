$defs:
  connection_pool:
    description: ConnectionPool configures the shared database connection pool used by all scrapers of the receiver. Any field left unset falls back to a default derived from the number of scrapers (see setConnectionPoolSettings).
    type: object
    properties:
      max_idle:
        description: MaxIdle is the maximum number of idle connections kept in the pool.
        x-pointer: true
        type: integer
      max_idle_time:
        description: MaxIdleTime is the maximum amount of time a connection may be idle before being closed. Zero means connections are not closed due to idle time.
        x-pointer: true
        type: string
        format: duration
      max_lifetime:
        description: MaxLifetime is the maximum amount of time a connection may be reused. Zero means connections are reused forever.
        x-pointer: true
        type: string
        format: duration
      max_open:
        description: MaxOpen is the maximum number of open connections to the database. Zero means unlimited.
        x-pointer: true
        type: integer
  query_sample:
    type: object
    properties:
      allowed_comment_keys:
        description: AllowedCommentKeys lists the keys to extract from the key=value pairs in the leading comments of the batch text of the db.server.query_sample event. Empty extracts nothing.
        type: array
        items:
          type: string
      collect_full_query_text:
        description: CollectFullQueryText enables collection of the full SQL batch text for the db.server.query_sample event, in addition to the statement-level substring already captured in db.query.text.
        type: boolean
      max_rows_per_query:
        type: integer
        x-customType: uint64
  top_procedure_collection:
    description: TopProcedureCollection configures the collection of stored procedure statistics. Candidate rows are fetched up to MaxProcedureSampleCount, then the TopProcedureCount procedures with the largest elapsed-time delta over the interval are reported.
    type: object
    properties:
      collection_interval:
        description: CollectionInterval throttles the query and sets the window the deltas cover.
        type: string
        format: duration
      max_procedure_sample_count:
        type: integer
        x-customType: uint
      top_procedure_count:
        type: integer
        x-customType: uint
  top_query_collection:
    type: object
    properties:
      allowed_comment_keys:
        description: AllowedCommentKeys lists the keys to extract from the key=value pairs in the leading comments of the batch text of the db.server.top_query event. Empty extracts nothing.
        type: array
        items:
          type: string
      collect_full_query_text:
        description: CollectFullQueryText enables collection of the full SQL batch text for the db.server.top_query event, in addition to the statement-level substring already captured in db.query.text.
        type: boolean
      collection_interval:
        type: string
        format: duration
      lookback_time:
        description: Enabled enables the collection of the top queries by the execution time. It will collect the top N queries based on totalElapsedTimeDiffs during the last collection interval. The query statement will also be reported, hence, it is not ideal to send it as a metric. Hence we are reporting them as logs. The `N` is configured via `TopQueryCount`
        type: string
        format: duration
      max_query_sample_count:
        type: integer
        x-customType: uint
      top_query_count:
        type: integer
        x-customType: uint
description: Config defines configuration for a sqlserver receiver.
type: object
properties:
  computer_name:
    type: string
  connection_pool:
    description: ConnectionPool tunes the shared database connection pool used by all scrapers of this receiver.
    $ref: connection_pool
  datasource:
    type: string
  instance_name:
    type: string
  password:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  port:
    type: integer
    x-customType: uint
  query_sample_collection:
    $ref: query_sample
  server:
    type: string
  top_procedure_collection:
    $ref: top_procedure_collection
  top_query_collection:
    description: EnableTopQueryCollection enables the collection of the top queries by the execution time. It will collect the top N queries based on totalElapsedTimeDiffs during the last collection interval. The query statement will also be reported, hence, it is not ideal to send it as a metric. Hence we are reporting them as logs. The `N` is configured via `TopQueryCount`
    $ref: top_query_collection
  username:
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
