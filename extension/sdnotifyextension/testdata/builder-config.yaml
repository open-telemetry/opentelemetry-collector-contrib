# Produces a minimal collector distribution used for integration tests.

dist:
  name: otelcol
  output_path: /home/ocb/build

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/sdnotifyextension v0.159.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.159.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.159.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.159.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/extension/sdnotifyextension => /src/extension/sdnotifyextension
