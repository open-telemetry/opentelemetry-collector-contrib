# Produces a minimal collector distribution used for integration tests.

dist:
  name: otelcol
  output_path: /home/ocb/build

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/sdnotifyextension v0.164.1

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.1-0.20261029175530-9afdf701f333

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.1-0.20261029175530-9afdf701f333
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.1-0.20261029175530-9afdf701f333

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/extension/sdnotifyextension => /src/extension/sdnotifyextension
