k8s_observer:
k8s_observer/own-node-only:
  node: node-1
  auth_type: kubeConfig
k8s_observer/observe-all:
  auth_type: none
  observe_nodes: true
  observe_pods: true
  observe_services: true
  observe_ingresses: true
k8s_observer/init-containers:
  observe_pods: true
  observe_init_containers: true
k8s_observer/invalid_init_without_pods:
  observe_pods: false
  observe_nodes: true
  observe_init_containers: true
k8s_observer/ephemeral-containers:
  auth_type: none
  observe_ephemeral_containers: true
k8s_observer/invalid_ephemeral_without_pods:
  observe_pods: false
  observe_nodes: true
  observe_ephemeral_containers: true
k8s_observer/invalid_auth:
  auth_type: not a real auth type
k8s_observer/invalid_no_observing:
  observe_nodes: false
  observe_pods: false
  observe_services: false
  observe_ingresses: false
