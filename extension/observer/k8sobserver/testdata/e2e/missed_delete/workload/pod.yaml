apiVersion: v1
kind: Pod
metadata:
  name: k8sobserver-e2e-missed-delete
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command: ["sleep", "3600"]
