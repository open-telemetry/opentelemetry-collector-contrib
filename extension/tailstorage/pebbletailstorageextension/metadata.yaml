display_name: Pebble Tail Storage Extension
type: pebble_tail_storage

description: Stores pending trace data for tail sampling in a local Pebble database.

tests:
  config:
    directory: test-storage

status:
  class: extension
  stability:
    alpha: [extension]
  distributions: [contrib]
  codeowners:
    active: [carsonip, jmacd, lahsivjar]
    emeritus: [axw]

telemetry:
  metrics:
    extension_pebble_tail_storage_append_errors:
      description: Count of errors returned by the Pebble tail storage extension Append operation
      stability: development
      unit: "{errors}"
      enabled: true
      sum:
        value_type: int
        monotonic: true

    extension_pebble_tail_storage_delete_errors:
      description: Count of errors returned by the Pebble tail storage extension Delete operation
      stability: development
      unit: "{errors}"
      enabled: true
      sum:
        value_type: int
        monotonic: true

    extension_pebble_tail_storage_read_errors:
      description: Count of Pebble tail storage read-path iterator creation, value read, payload decode, and iterator terminal errors
      stability: development
      unit: "{errors}"
      enabled: true
      sum:
        value_type: int
        monotonic: true

    extension_pebble_tail_storage_take_errors:
      description: Count of errors returned by the Pebble tail storage extension Take operation
      stability: development
      unit: "{errors}"
      enabled: true
      sum:
        value_type: int
        monotonic: true
