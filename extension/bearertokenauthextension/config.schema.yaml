description: Config specifies how the Per-RPC bearer token based authentication data should be obtained.
type: object
properties:
  filename:
    description: Filename points to a file that contains the bearer token(s) to use for every RPC.
    type: string
  header:
    description: Header specifies the auth-header for the token. Defaults to "Authorization"
    type: string
  retry_on_failure:
    description: RetryOnFailure configures startup retry behavior when the file referenced by Filename is not yet available. Disabled by default.
    $ref: /extension/internal/credentialsfile.retry_on_failure_config
  scheme:
    description: Scheme specifies the auth-scheme for the token. Defaults to "Bearer"
    type: string
  token:
    description: BearerToken specifies the bearer token to use for every RPC.
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  tokens:
    description: Tokens specifies multiple bearer tokens to use for every RPC.
    type: array
    items:
      $ref: go.opentelemetry.io/collector/config/configopaque.string
  wait_for_token_file:
    description: WaitForTokenFile makes Start block until the token file is read successfully (respecting RetryOnFailure) instead of retrying in the background. If the file cannot be read within the retry budget, Start returns an error and collector startup fails. Disabled by default.
    type: boolean
