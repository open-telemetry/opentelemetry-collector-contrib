oauth2client:
  client_id: someclientid
  client_secret: someclientsecret
  token_url: https://example.com/oauth2/default/v1/token
  endpoint_params:
    audience: someaudience
  scopes: ["api.metrics"]
  timeout: 1s

oauth2client/jwt-bearer-grant-type:
  client_id: someclientid
  client_certificate_key: secret_key
  grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
  token_url: https://example.com/oauth2/default/v1/token
  endpoint_params:
    audience: someaudience
  scopes: ["api.metrics"]
  timeout: 1s

oauth2client/withtls:
  client_id: someclientid2
  client_secret: someclientsecret2
  token_url: https://example2.com/oauth2/default/v1/token
  scopes: ["api.metrics"]
  timeout: 1s
  expiry_buffer: 15s
  # tls settings for the token client
  tls:
    insecure: true
    ca_file: cafile
    cert_file: certfile
    key_file: keyfile

oauth2client/missingid:
  client_secret: someclientsecret
  token_url: https://example.com/oauth2/default/v1/token
  scopes: ["api.metrics"]

oauth2client/missingsecret:
  client_id: someclientid
  token_url: https://example.com/oauth2/default/v1/token
  scopes: ["api.metrics"]

oauth2client/missingcertificate:
  client_id: someclientid
  grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
  token_url: https://example.com/oauth2/default/v1/token
  scopes: ["api.metrics"]

oauth2client/missingurl:
  client_id: someclientid
  client_secret: someclientsecret
  scopes: ["api.metrics"]

oauth2client/private-key-jwt:
  client_id: someclientid
  token_endpoint_auth_method: private_key_jwt
  client_certificate_key_file: /etc/otelcol/oauth/client.key
  client_certificate_key_id: key-1
  audience: https://issuer.example.com/oauth2/token
  token_url: https://example.com/oauth2/default/v1/token
  scopes: ["api.metrics"]
  timeout: 1s

oauth2client/private-key-jwt-missingkey:
  client_id: someclientid
  token_endpoint_auth_method: private_key_jwt
  token_url: https://example.com/oauth2/default/v1/token

oauth2client/private-key-jwt-withsecret:
  client_id: someclientid
  client_secret: someclientsecret
  token_endpoint_auth_method: private_key_jwt
  client_certificate_key_file: /etc/otelcol/oauth/client.key
  token_url: https://example.com/oauth2/default/v1/token

oauth2client/private-key-jwt-withjwtbearer:
  client_id: someclientid
  grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
  token_endpoint_auth_method: private_key_jwt
  client_certificate_key_file: /etc/otelcol/oauth/client.key
  token_url: https://example.com/oauth2/default/v1/token

oauth2client/invalidauthmethod:
  client_id: someclientid
  client_secret: someclientsecret
  token_endpoint_auth_method: tls_client_auth
  token_url: https://example.com/oauth2/default/v1/token

oauth2client/client-secret-post:
  client_id: someclientid
  client_secret: someclientsecret
  token_endpoint_auth_method: client_secret_post
  token_url: https://example.com/oauth2/default/v1/token
