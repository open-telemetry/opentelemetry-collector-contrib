type: aws_iam_db_auth

status:
  class: extension
  stability:
    alpha: [extension]
  distributions: [contrib]
  codeowners:
    active: [XSAM]

tests:
  config:
    region: us-east-1

# This component is a credentials provider for the db_auth framework (see
# extension/dbauth and config/configdbauth), not a transport authenticator.
# It mints short-lived AWS RDS IAM database auth tokens and is referenced by
# receivers via their db_auth block and resolved from the host extension map.
