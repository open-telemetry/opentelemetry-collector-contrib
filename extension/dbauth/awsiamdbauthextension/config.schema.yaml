description: 'Config is the aws_iam_db_auth provider extension''s config. It carries the provider-wide inputs an operator sets on the extension: extensions: aws_iam_db_auth: region: us-east-1   # required Region is required. The per-connection mint inputs — the database endpoint and user — travel with each GetCredential call as a dbauth.Request, sourced from the consuming component''s own endpoint and configured username.'
type: object
properties:
  region:
    description: 'Region is the AWS region of the database. Required: a token cannot be minted without it, so it is validated at config load.'
    type: string
