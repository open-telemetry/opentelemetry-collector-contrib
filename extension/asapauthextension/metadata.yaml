display_name: ASAP Client Authentication Extension
type: asapclient

description: |
  This extension provides [Atlassian Service Authentication Protocol](https://s2sauth.bitbucket.io/) (ASAP) client 
  credentials for HTTP or gRPC based exporters.

status:
  class: extension
  stability:
    deprecated: [extension]
  deprecation:
    extension:
      migration: "This extension has depedencies which rely on go 1.26 which will no longer be supported when the next version is available. It is being deprecated and removed."
      date: "2026-11-27"
  distributions: [contrib]
  codeowners:
    active: [jamesmoessis, MovieStoreGuy]
