name: e2e-tests

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  merge_group:

permissions:
  contents: read

env:
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

# Do not cancel this workflow on main. See https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/16616
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  collector-build:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Generate otelcontribcol files
        run: make genotelcontribcol
      - name: Build Collector
        run: make otelcontribcol
      - name: Upload Collector Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-binary
          path: ./bin/*
      - run: ./.github/workflows/scripts/check-disk-space.sh

  supervisor-test:
    runs-on: ubuntu-24.04
    needs: collector-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Download Collector Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collector-binary
          path: bin/
      - run: chmod +x bin/*
      - name: Run opampsupervisor e2e tests
        run: |
          cd cmd/opampsupervisor
          make e2e-test
      - run: ./.github/workflows/scripts/check-disk-space.sh

  datadog-examples-test:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Validate Datadog example configs
        run: |
          cd internal/datadog/e2e
          go test -v -tags=e2e -timeout 10m ./...
      - run: ./.github/workflows/scripts/check-disk-space.sh

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Generate otelcontribcol files
        run: make genotelcontribcol
      - name: Build Docker Image
        run: |
          make docker-otelcontribcol
      - name: export image to tar
        run: |
          docker save otelcontribcol:latest > /tmp/otelcontribcol.tar
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otelcontribcol
          path: /tmp/otelcontribcol.tar
      - run: ./.github/workflows/scripts/check-disk-space.sh

  kubernetes-test-matrix:
    env:
      KUBECONFIG: /tmp/kube-config-otelcol-e2e-testing
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - "v1.34.0"
          - "v1.35.0"
        component:
          - receiver/k8sclusterreceiver
          - processor/k8sattributesprocessor
          - processor/resourcedetectionprocessor
          - receiver/kubeletstatsreceiver
          - receiver/k8seventsreceiver
          - receiver/k8sobjectsreceiver
          - extension/observer/k8sobserver
    runs-on: ubuntu-24.04
    needs: docker-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          node_image: kindest/node:${{ matrix.k8s-version }}
          kubectl_version: ${{ matrix.k8s-version }}
          cluster_name: kind
          config: ./.github/workflows/configs/e2e-kind-config.yaml
      - name: Fix kubelet TLS server certificates
        run: |
          kubectl get csr -o=jsonpath='{range.items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.metadata.name}{" "}{end}' | xargs kubectl certificate approve
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcontribcol
          path: /tmp
      - name: Load Docker image
        run: |
          docker load --input /tmp/otelcontribcol.tar
      - name: Kind load image
        run: |
          kind load docker-image otelcontribcol:latest --name kind
      - name: Run e2e tests
        run: |
          cd ${{ matrix.component }}
          go test -v --tags=e2e -timeout 20m
      - run: ./.github/workflows/scripts/check-disk-space.sh

  kubernetes-test:
    if: ${{ github.actor != 'dependabot[bot]' && always() }}
    runs-on: ubuntu-slim
    needs: [kubernetes-test-matrix]
    steps:
      - name: Print result
        run: echo ${{ needs.kubernetes-test-matrix.result }}
      - name: Interpret result
        run: |
          if [[ success == ${{ needs.kubernetes-test-matrix.result }} ]]
          then
            echo "All matrix jobs passed!"
          else
            echo "One or more matrix jobs failed."
            false
          fi

  # Runs the OpenShift detector e2e test on MicroShift (real OpenShift runtime:
  # SCCs, CRI-O). Only runs when OpenShift-related paths change; not a required check.
  openshift-test:
    runs-on: ubuntu-24.04
    needs: docker-build
    env:
      KUBECONFIG: /tmp/kube-config-otelcol-e2e-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            openshift:
              - 'processor/resourcedetectionprocessor/internal/openshift/**'
              - 'internal/metadataproviders/openshift/**'
              - 'processor/resourcedetectionprocessor/testdata/e2e/openshift-cluster/**'
              - 'processor/resourcedetectionprocessor/e2e_test.go'
              - 'pkg/xk8stest/**'
              - '.github/workflows/e2e-tests.yml'
      - uses: $/.github/actions/setup-go-tools
        if: steps.filter.outputs.openshift == 'true'
        with:
          go-version: oldstable
      - name: Enable KVM access for runner
        if: steps.filter.outputs.openshift == 'true'
        run: sudo chmod 666 /dev/kvm
      - name: Start MicroShift via CRC
        if: steps.filter.outputs.openshift == 'true'
        uses: crc-org/crc-github-action@466b8741bd91b9ee59f37db92b69f285cacada41 # v1.0.1
        with:
          preset: microshift
      - name: Export KUBECONFIG
        if: steps.filter.outputs.openshift == 'true'
        run: cp ~/.kube/config "$KUBECONFIG"
      - name: Download artifact
        if: steps.filter.outputs.openshift == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: otelcontribcol
          path: /tmp
      - name: Load image into MicroShift CRI-O storage
        if: steps.filter.outputs.openshift == 'true'
        run: |
          CRC_IP=$(sg libvirt -c "crc ip")
          # CRI-O reads root podman storage; tag as docker.io/library to match what kind load produces.
          ssh -i ~/.crc/machines/crc/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            core@"$CRC_IP" 'sudo podman load && sudo podman tag localhost/otelcontribcol:latest docker.io/library/otelcontribcol:latest' < /tmp/otelcontribcol.tar
          echo "HOST_ENDPOINT=$(ip route get "$CRC_IP" | grep -oP 'src \K[\d.]+')" >> "$GITHUB_ENV"
      - name: Run OpenShift e2e test
        if: steps.filter.outputs.openshift == 'true'
        run: |
          cd processor/resourcedetectionprocessor
          go test -v --tags=e2e -run TestE2EOpenShiftInCluster
