name: load-tests

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
  schedule:
    - cron: "27 0,12 * * *" # Run at 00:27 and 12:27 UTC every day.
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    branches:
      - main

# Do not cancel this workflow on main. See https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/16616
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

permissions:
  contents: read

jobs:
  setup-environment:
    timeout-minutes: 30
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    if: ${{ github.actor != 'dependabot[bot]' &&  github.repository_owner == 'open-telemetry' && (contains(github.event.pull_request.labels.*.name, 'Run Load Tests') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    outputs:
      loadtest_matrix: ${{ steps.splitloadtest.outputs.loadtest_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - run: make genoteltestbedcol
      - run: make oteltestbedcol
      - run: GOOS=linux GOARCH=arm64 make oteltestbedcol
      - name: Upload Testbed Binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testbed-binaries
          path: ./bin/*
      - name: Split Loadtest Jobs
        id: splitloadtest
        run: ./.github/workflows/scripts/setup_e2e_tests.sh
      - run: ./.github/workflows/scripts/check-disk-space.sh

  loadtest:
    needs: [setup-environment]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-environment.outputs.loadtest_matrix) }}
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable
      - run: mkdir -p results && touch results/TESTRESULTS.md
      - name: Download Testbed Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testbed-binaries
          path: bin/
      - run: chmod +x bin/*
      # Remove any pre-installed kwokctl so the action installs the pinned version
      - name: Remove existing KWOK binaries
        run: |
          sudo rm -f /usr/local/bin/kwokctl /usr/local/bin/kwok
      - name: Install KWOK (kwokctl)
        uses: kubernetes-sigs/kwok@156033d7df7ea0e09cea82b715fe566ea68aeeb4 # v0.8.0
        with:
          command: kwokctl
      - name: Loadtest
        run: make -C testbed run-tests
        env:
          RUN_TYPE: "${{ matrix.type == 'linux-arm64' && 'linux_arm64' || '' }}"
          TEST_ARGS: "-test.run=${{ matrix.test }}"
      - name: Set results filename
        if: ${{ failure() || success() }}
        id: filename
        env:
          MATRIX_TEST: ${{ matrix.test }}
        run: echo "name=${MATRIX_TEST//|/_}" >> "$GITHUB_OUTPUT"
      - name: Create Test Result Archive
        if: ${{ failure() || success() }}
        continue-on-error: true
        env:
          FILENAME: ${{ steps.filename.outputs.name }}
        run: tar -cvf "test_results_${FILENAME}.tar" testbed/tests/results
      - name: Upload Test Results
        if: ${{ failure() || success() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-result-archive-${{steps.filename.outputs.name}}
          path: ./*.tar
      - name: Copy benchmark results
        env:
          FILENAME: ${{ steps.filename.outputs.name }}
        run: cp testbed/tests/results/benchmarks.json "testbed/tests/results/${FILENAME}.json"
      - name: Upload benchmarks.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{steps.filename.outputs.name}}
          path: testbed/tests/results/${{steps.filename.outputs.name}}.json
      - run: ./.github/workflows/scripts/check-disk-space.sh

  update-benchmarks:
    runs-on: ubuntu-slim
    needs: [loadtest]
    permissions:
      # deployments permission to deploy GitHub pages website
      deployments: write
      # contents permission to update benchmark contents in gh-pages branch
      contents: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-results-*
          merge-multiple: true
          path: results
      - run: jq -s 'map(.[])' results/*.json > output.json
      - uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "customSmallerIsBetter"
          output-file-path: output.json
          gh-pages-branch: benchmarks
          max-items-in-chart: 100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: "docs/benchmarks/loadtests"
          auto-push: true

  workflow-notification:
    permissions:
      issues: write
    needs:
      - setup-environment
      - loadtest
      - update-benchmarks
    if: always() && github.event_name != 'pull_request'
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@68c7b2f0ef9cd9c1e2b71d3018f63127be189578 # v0.14.0
    with:
      success: >-
        ${{
          needs.setup-environment.result == 'success' &&
          needs.loadtest.result == 'success' &&
          needs.update-benchmarks.result == 'success'
        }}
