name: prometheus-compliance-tests
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  merge_group:

permissions:
  contents: read

# Do not cancel this workflow on main. See https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/16616
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  prometheus-compliance-tests:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opentelemetry-collector-contrib
      - run: opentelemetry-collector-contrib/.github/workflows/scripts/free-disk-space.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: go-setup
        with:
          go-version: oldstable
          cache-dependency-path: |
            opentelemetry-collector-contrib/internal/tools/go.sum
            opentelemetry-collector-contrib/testbed/go.sum
            opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter/compliance/go.sum
      - name: Install dependencies
        if: steps.go-setup.outputs.cache-hit != 'true'
        working-directory: opentelemetry-collector-contrib
        run: make -j2 gomoddownload
      - run: make genotelcontribcol
        working-directory: opentelemetry-collector-contrib
      - run: make otelcontribcol
        working-directory: opentelemetry-collector-contrib
      - name: Run remote write sender compliance tests
        # Skipped tests are known compliance gaps in the prometheusremotewrite
        # exporter and prometheus receiver:
        #   - start_timestamp_for_*: the RW2 translator does not propagate
        #     OTLP start timestamps into writev2.Sample.StartTimestamp.
        #   - samples_sorted: the prometheus receiver keeps only one sample
        #     per series per scrape, dropping explicitly timestamped samples.
        run: |
          set -o pipefail && \
          go test -v -count=1 \
            -skip 'TestRemoteWriteSender/otelcol-contrib/samples/rw2/start_timestamp_for_(counters|histograms)|TestRemoteWriteSender/otelcol-contrib/samples_sorted' \
            ./ |& tee ./test-report.txt
        working-directory: opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter/compliance
      - run: opentelemetry-collector-contrib/.github/workflows/scripts/check-disk-space.sh
