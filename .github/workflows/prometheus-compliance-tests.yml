name: prometheus-compliance-tests
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    paths-ignore:
      - "**/README.md"
  pull_request:
    paths-ignore:
      - "**/README.md"
  merge_group:

permissions:
  contents: read

# Do not cancel this workflow on main. See https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/16616
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Make sure to exit early if cache segment download times out after 2 minutes.
  # We limit cache download as a whole to 5 minutes.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  # Distinct spellings of the same proxy joined by `|` make Go retry any fetch error. Keep in sync with Makefile.Common.
  GOPROXY: "https://proxy.golang.org|https://proxy.golang.org/|https://proxy.golang.org:443,direct"

jobs:
  prometheus-compliance-tests:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opentelemetry-collector-contrib
          persist-credentials: false
      - run: opentelemetry-collector-contrib/.github/workflows/scripts/free-disk-space.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: oldstable
          cache: false
      - name: Install dependencies
        working-directory: opentelemetry-collector-contrib
        run: make -j8 gomoddownload
      - run: make genotelcontribcol
        working-directory: opentelemetry-collector-contrib
      - run: make otelcontribcol
        working-directory: opentelemetry-collector-contrib
      - name: Run compliance tests
        working-directory: opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter/compliance
        run: |
          set -o pipefail
          # Skip known compliance gaps:
          # - samples_sorted: receiver/prometheus deduplicates multiple samples for the same series in one scrape.
          # - stale_markers: test expects initial sample and staleness marker in a single Remote-Write request.
          # - start_timestamp_*: receiver/prometheus truncates float64 _created timestamps by up to 1ms.
          # - float_histogram: pmetric exponential histograms store bucket counts as uint64.
          # - type_info_and_stateset: exporter/prometheusremotewrite does not emit INFO/STATESET metadata types yet.
          SKIP_TESTS="TestRemoteWriteSender/otelcol-contrib/(samples_sorted|stale_markers)"
          SKIP_TESTS+="|TestRemoteWriteSender/otelcol-contrib/samples/rw2/start_timestamp_for_.*"
          SKIP_TESTS+="|TestRemoteWriteSender/otelcol-contrib/native_histograms/rw2/(float_histogram|start_timestamp_before_timestamp)"
          SKIP_TESTS+="|TestRemoteWriteSender/otelcol-contrib/metadata/rw2/type_info_and_stateset"
          go test -v -count=1 -skip "${SKIP_TESTS}" ./ |& tee ./test-report.txt
      - run: opentelemetry-collector-contrib/.github/workflows/scripts/check-disk-space.sh
