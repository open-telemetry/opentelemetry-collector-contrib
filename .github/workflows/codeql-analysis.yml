name: "CodeQL Analysis"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"

permissions: read-all

jobs:
  CodeQL-Build:
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      # Force CodeQL to run the extraction on the files compiled by our custom
      # build command, as opposed to letting the autobuilder figure it out.
      # See: https://github.com/github/codeql-action/issues/1101#issuecomment-1157729589
      CODEQL_EXTRACTOR_GO_BUILD_TRACING: "on"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-go-tools
        with:
          go-version: oldstable

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go

      - name: Build Artifact
        run: |
          make genotelcontribcol
          make otelcontribcol

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        timeout-minutes: 60

      - run: ./.github/workflows/scripts/check-disk-space.sh
