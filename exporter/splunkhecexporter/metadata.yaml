type: splunk_hec
display_name: Splunk HTTP Event Collector (HEC) Exporter

status:
  class: exporter
  stability:
    beta: [traces, metrics, logs]
    development: [profiles]
  distributions: [contrib]
  codeowners:
    active: [atoulme, dmitryax]

telemetry:
  metrics:
    exporter_splunkhec_heartbeats_failed:
      enabled: true
      stability: development
      description: Number of heartbeats failed by the Splunk HEC exporter.
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    exporter_splunkhec_heartbeats_sent:
      enabled: true
      stability: development
      description: Number of heartbeats sent by the Splunk HEC exporter.
      unit: "1"
      sum:
        value_type: int
        monotonic: true

tests:
  config:
    token: "my_fake_token"
    endpoint: "http://localhost:0"
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
  expect_consumer_error: true
