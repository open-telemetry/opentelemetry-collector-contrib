# Error code regex: [A-Z][A-Z0-9]+_[A-Z0-9_]+
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 1800
    spike_limit_mib: 500
  resource_detection/system:
    detectors: [ "system" ]
    system:
      hostname_sources: [ "os" ]
  resource:
    attributes:
      - key: service.name
        value: "serviceName"
        action: upsert
exporters:
  clickhouse:
    create_db_and_tables: true
    endpoint: http://clickhouse:8123
    database: otel
    logs_table_name: otel_logs_1
    traces_table_name: otel_traces
    connection_params:
      async_insert: 1
      wait_for_async_insert: 0
    ttl_days: 1
    timeout: 10s
    sending_queue:
      queue_size: 1000
      # Batch inserts inside the exporter's sending queue instead of using the
      # standalone `batch` processor. ClickHouse performs best with large inserts.
      # `num_consumers` still controls how many inserts run concurrently.
      batch:
        min_size: 5000       # rows per INSERT (items sizer); tune to your workload
        flush_timeout: 5s    # flush a partial batch after this delay
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    username: default
    password: default
extensions:
#  file_storage:
#    directory: /var/lib/otelcol
  health_check:
  pprof:
  zpages:

service:
  extensions:
    - pprof
    - zpages
    - health_check
#    - file_storage
  pipelines:
    logs:
      receivers: [ fluentforward, otlp ]
      processors: [ memory_limiter, resource_detection/system, resource ]
      exporters: [ clickhouse ]
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, resource_detection/system, resource ]
      exporters: [ clickhouse ]
