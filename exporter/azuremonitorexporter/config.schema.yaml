$defs:
  http_mappings_config:
    description: HTTPMappingsConfig configures mappings applied to HTTP spans.
    type: object
    properties:
      success:
        $ref: http_success_config
  http_success_config:
    description: HTTPSuccessConfig configures how HTTP response status codes map to Application Insights Success.
    type: object
    properties:
      additional_success_status_codes:
        description: AdditionalSuccessStatusCodes are treated as successful for HTTP server and client spans.
        type: array
        items:
          type: integer
      server_policy:
        description: ServerPolicy may be set to "otel" to follow OpenTelemetry HTTP server span semantics.
        type: string
  tag_mappings_config:
    description: TagMappingsConfig overrides the precedence used to populate selected Application Insights envelope tags from OpenTelemetry resource attributes. Each field is an ordered list of sources consulted left-to-right; the first source that resolves to a non-empty string wins. A source entry is interpreted as a resource attribute key when it contains a "." (e.g. "service.instance.id"); otherwise it is treated as a string literal terminal default (e.g. "unknown-instance"). When a field is left unset, the factory default — which preserves the historical hardcoded behavior — is used. This feature is alpha and the schema may evolve.
    type: object
    properties:
      application_version:
        description: 'ApplicationVersion controls how the ai.application.ver envelope tag is populated. Default: [service.version].'
        type: array
        items:
          type: string
      cloud_role_instance:
        description: 'CloudRoleInstance controls how the ai.cloud.roleInstance envelope tag is populated. Default: [service.instance.id].'
        type: array
        items:
          type: string
  telemetry_mappings_config:
    type: object
    properties:
      traces:
        $ref: trace_mappings_config
  trace_mappings_config:
    description: TraceMappingsConfig configures mappings applied when exporting traces.
    type: object
    properties:
      http:
        $ref: http_mappings_config
description: Config defines configuration for Azure Monitor
type: object
properties:
  connection_string:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  custom_events_enabled:
    type: boolean
  exception_events_enabled:
    type: boolean
  instrumentation_key:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  maxbatchinterval:
    type: string
    format: duration
  maxbatchsize:
    type: integer
  sending_queue:
    x-optional: true
    $ref: go.opentelemetry.io/collector/exporter/exporterhelper.queue_batch_config
  shutdown_timeout:
    type: string
    format: duration
  spaneventsenabled:
    type: boolean
  tag_mappings:
    $ref: tag_mappings_config
  telemetry_mappings:
    $ref: telemetry_mappings_config
allOf:
  - $ref: go.opentelemetry.io/collector/config/confighttp.client_config
