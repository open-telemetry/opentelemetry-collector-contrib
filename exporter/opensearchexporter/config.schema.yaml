$defs:
  ism_config:
    description: ISMConfig configures opt-in Index State Management (ISM) policy creation for otel-v1 indices. When enabled, the exporter creates a rollover policy and an initial write-aliased index on startup so otel-v1 indices roll over by size/age instead of growing unbounded.
    type: object
    properties:
      enabled:
        description: Enabled controls whether an ISM rollover policy is created on startup.
        type: boolean
      policy_file:
        description: PolicyFile is an optional path to a JSON file containing a full ISM policy body. When set, it is used verbatim instead of the built-in rollover policy, and the RolloverMinSize/RolloverMinIndexAge options are ignored.
        type: string
      rollover_min_index_age:
        description: RolloverMinIndexAge is the minimum index age before rollover (e.g. "24h"). Used only by the built-in policy. Defaults to "24h" when empty.
        type: string
      rollover_min_size:
        description: RolloverMinSize is the minimum primary-shard-inclusive index size before rollover (e.g. "50gb"). Used only by the built-in policy. Defaults to "50gb" when empty.
        type: string
  mappings_settings:
    type: object
    properties:
      dedot:
        type: boolean
      dedup:
        description: Try to find and remove duplicate fields
        type: boolean
      fields:
        description: Additional field mappings.
        type: object
        additionalProperties:
          type: string
      file:
        description: File to read additional fields mappings from.
        type: string
      index_template_file:
        description: IndexTemplateFile is an optional path to a JSON file whose contents are deep-merged over the built-in otel-v1 index template before it is created. Use it to uplift common attributes to typed fields or to keep high-cardinality attributes un-indexed, without forking the exporter. Object values are merged recursively; array and scalar values in the file replace the built-in ones. Only used when ManageIndexTemplate is true and Mode is "otel-v1".
        type: string
      ism:
        description: ISM configures opt-in Index State Management (rollover) policy creation on startup. Only supported when Mode is "otel-v1".
        $ref: ism_config
      manage_index_template:
        description: ManageIndexTemplate controls whether the exporter creates index templates on startup. Only supported when Mode is "otel-v1". Validation will reject this option with other modes.
        type: boolean
      mode:
        description: 'Mode configures the field mappings. Supported modes are the following: ss4o: exports logs in the Simple Schema for Observability standard. This mode is enabled by default. See: https://opensearch.org/docs/latest/observing-your-data/ss4o/ ecs: maps fields defined in the OpenTelemetry Semantic Conventions to the Elastic Common Schema. See: https://www.elastic.co/guide/en/ecs/current/index.html flatten_attributes: uses the ECS mapping but flattens all resource and log attributes in the record to the top-level. bodymap: supports only logs and uses the "body" of a log record as the exact content of the OpenSearch document, without any transformation. This mapping mode is intended for use cases where the client wishes to have complete control over the OpenSearch document structure. otel-v1: exports logs and traces using the OTel v1 schema published by the OpenSearch Data Prepper project (https://github.com/opensearch-project/data-prepper). Documents are compatible with OpenSearch Observability dashboards that consume Data Prepper indices. See the upstream index templates for the canonical field mappings: https://github.com/opensearch-project/data-prepper/blob/main/data-prepper-plugins/opensearch/src/main/resources/index-template/otel-v1-apm-span-index-standard-template.json https://github.com/opensearch-project/data-prepper/blob/main/data-prepper-plugins/opensearch/src/main/resources/index-template/logs-otel-v1-index-standard-template.json'
        type: string
      timestamp_field:
        description: Field to store timestamp in.  If not set uses the default @timestamp
        type: string
      unix_timestamp:
        description: Whether to store timestamp in Epoch milliseconds
        type: boolean
description: Config defines configuration for OpenSearch exporter.
type: object
properties:
  bulk_action:
    description: BulkAction configures the action for ingesting data. Only `create` and `index` are allowed here. If not specified, the default value `create` will be used.
    type: string
  dataset:
    description: The Observability indices would follow the recommended for immutable data stream ingestion pattern using the data_stream concepts. See https://opensearch.org/docs/latest/dashboards/im-dashboards/datastream/ Index pattern will follow the next naming template ss4o_{type}-{dataset}-{namespace}
    type: string
  http:
    $ref: go.opentelemetry.io/collector/config/confighttp.client_config
  logs_index:
    description: LogsIndex configures the index, index alias, or data stream name logs should be indexed in. https://opensearch.org/docs/latest/im-plugin/index/ https://opensearch.org/docs/latest/dashboards/im-dashboards/datastream/
    type: string
  logs_index_fallback:
    type: string
  logs_index_time_format:
    type: string
  mapping:
    $ref: mappings_settings
  namespace:
    type: string
  pipeline:
    description: Pipeline is the optional ID of an ingest pipeline to apply when indexing documents. https://opensearch.org/docs/latest/ingest-pipelines/
    type: string
  retry_on_failure:
    $ref: go.opentelemetry.io/collector/config/configretry.back_off_config
  sending_queue:
    x-optional: true
    $ref: go.opentelemetry.io/collector/exporter/exporterhelper.queue_batch_config
  traces_index:
    description: TracesIndex configures the index, index alias, or data stream name traces should be indexed in. https://opensearch.org/docs/latest/im-plugin/index/ https://opensearch.org/docs/latest/dashboards/im-dashboards/datastream/
    type: string
  traces_index_fallback:
    type: string
  traces_index_time_format:
    type: string
allOf:
  - $ref: go.opentelemetry.io/collector/exporter/exporterhelper.timeout_config
