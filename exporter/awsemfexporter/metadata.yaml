type: awsemf
display_name: AWS CloudWatch EMF Exporter

status:
  class: exporter
  stability:
    beta: [metrics]
  distributions: [contrib]
  codeowners:
    active: [Aneurysm9, mxiamxia]
    emeritus: [shaochengwang, bryan-aguilar]

feature_gates:
  - id: "awsemf.nodimrollupdefault"
    description: Changes the default AWS EMF Exporter Dimension rollup option to NoDimensionRollup
    stage: alpha
    from_version: v0.83.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/23997
    skip_strict_validation: true
  - id: exporter.awsemf.DisableLegacyResourceToTelemetryConversion
    description: When enabled, the deprecated enabled and exclude_service_attributes fields in resource_to_telemetry_conversion are disabled, and included/excluded patterns must be used instead
    stage: alpha
    from_version: "v0.160.0"
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/48861

tests:
  config:
    region: 'us-west-2'
    resource_to_telemetry_conversion:
      enabled: true
  expect_consumer_error: true