type: influxdb
display_name: InfluxDB Exporter

status:
  class: exporter
  stability:
    beta: [traces, metrics, logs]
  distributions: [contrib]
  codeowners:
    active: [chinmaychahar]
    emeritus: [jacobmarble]

sending_queue:
  support: has_overrides
  overrides:
    enabled: true
    batch:
      enabled: true

tests:
  expect_consumer_error: true
