$defs:
  prioritizer_name:
    type: string
  stream_restart_config:
    description: StreamRestartConfig controls the delay between failed stream attempts. Stream retries continue until shutdown or downgrade, without an elapsed-time limit.
    type: object
    properties:
      initial_interval:
        type: string
        format: duration
      max_interval:
        type: string
        format: duration
      multiplier:
        type: number
        x-customType: float64
      randomization_factor:
        type: number
        x-customType: float64
